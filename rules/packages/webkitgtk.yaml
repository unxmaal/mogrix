    # --- HTTPS/TLS diagnostics (TEMPORARY) ---
    # Instrument the TLS path: GIO module loading, cert verification, error reporting.
    # All gated behind MOGRIX_DIAG env var (see webkit_subprocess_diag.h).
    #
    # Copy diag header to WebCore/platform/network/soup/
    - cp %{_sourcedir}/webkit_subprocess_diag.h Source/WebCore/platform/network/soup/webkit_subprocess_diag.h
    # Include in SoupNetworkSession.cpp
    - perl -i -pe 's{^(#include "SoupNetworkSession\.h")}{$1\n#include "webkit_subprocess_diag.h"}' Source/WebCore/platform/network/soup/SoupNetworkSession.cpp
    # (TLS-1) SoupNetworkSession constructor: TLS backend + TLS DB availability
    # NOTE: soup2 has no soup_session_get_tls_database(); use g_object_get on "tls-database" property
    - "perl -i -pe 's{(    setupLogger\\(\\);)}{    { void* _tlsb = (void*)g_tls_backend_get_default(); MOGRIX_DIAG_INT(\"TLS_tlsBackend\", (int)(_tlsb != 0)); void* _tlsdb = NULL; g_object_get(G_OBJECT(m_soupSession.get()), \"tls-database\", \\&_tlsdb, NULL); MOGRIX_DIAG_INT(\"TLS_tlsDB\", (int)(_tlsdb != 0)); }\\n$1}' Source/WebCore/platform/network/soup/SoupNetworkSession.cpp"
    # (TLS-2) DEVELOPER_MODE bypass: move WEBKIT_TLS_CAFILE_PEM outside ifdef
    - "perl -i -pe 's{^#if ENABLE\\(DEVELOPER_MODE\\)$}{/* IRIX: moved out of DEVELOPER_MODE for bundle CA cert loading */}' Source/WebCore/platform/network/soup/SoupNetworkSession.cpp"
    - "perl -i -pe 's{^#endif // ENABLE\\(DEVELOPER_MODE\\)$}{/* end IRIX DEVELOPER_MODE removal */}' Source/WebCore/platform/network/soup/SoupNetworkSession.cpp"
    # (TLS-3) Log WEBKIT_TLS_CAFILE_PEM env var value
    - "perl -i -pe 's{(const char\\* customTLSCAFile = g_getenv\\(\"WEBKIT_TLS_CAFILE_PEM\"\\);)}{$1 MOGRIX_DIAG_STR(\"TLS_caFilePath\", customTLSCAFile ? customTLSCAFile : \"(unset)\");}' Source/WebCore/platform/network/soup/SoupNetworkSession.cpp"
    # (TLS-4) checkTLSErrors: entry with ignoreTLS flag and TLS error flags
    - "perl -i -pe 's{(if \\(m_ignoreTLSErrors \\|\\| !tlsErrors\\))}{MOGRIX_DIAG_INT(\"TLS_ignoreTLS\", (int)m_ignoreTLSErrors); MOGRIX_DIAG_INT(\"TLS_checkTLS_flags\", (int)tlsErrors); $1}' Source/WebCore/platform/network/soup/SoupNetworkSession.cpp"
    # (TLS-5) checkTLSErrors: reject path (cert verification failed)
    - "perl -i -pe 's{(return ResourceError::tlsError\\(requestURL, tlsErrors, certificate\\);)}{MOGRIX_DIAG(\"TLS_checkTLS_REJECT\"); $1}' Source/WebCore/platform/network/soup/SoupNetworkSession.cpp"
    # (TLS-6) Request scheme logging (after NP-10 soup_session_send_async tag)
    - "perl -i -pe 's{(MOGRIX_DIAG\\(\"NP_soup_send_async\"\\);)}{$1 { const char *_s = soup_message_get_uri(m_soupMessage.get()) ? soup_uri_get_scheme(soup_message_get_uri(m_soupMessage.get())) : \"(null)\"; MOGRIX_DIAG_STR(\"TLS_reqScheme\", _s); }}' Source/WebKit/NetworkProcess/soup/NetworkDataTaskSoup.cpp"
    # (TLS-7) Soup error details: domain, code, message (after NP-13 soupFinish_err tag)
    - "perl -i -pe 's{(MOGRIX_DIAG_INT\\(\"NP_soupFinish_err\", \\(int\\)\\(!!error\\)\\);)}{$1 if (error) { MOGRIX_DIAG_STR(\"TLS_soupErr_domain\", g_quark_to_string(error.get()->domain)); MOGRIX_DIAG_INT(\"TLS_soupErr_code\", error.get()->code); MOGRIX_DIAG_STR(\"TLS_soupErr_msg\", error.get()->message); }}' Source/WebKit/NetworkProcess/soup/NetworkDataTaskSoup.cpp"
    # (TLS-8) acceptCertificate: entry + TLS error flags bitmask
    - "perl -0777 -i -pe 's{(bool NetworkDataTaskSoup::acceptCertificate\\(GTlsCertificate\\* certificate, GTlsCertificateFlags tlsErrors\\)\\n\\{)}{$1\\n    MOGRIX_DIAG(\"TLS_acceptCert_ENTRY\"); MOGRIX_DIAG_INT(\"TLS_acceptCert_flags\", (int)tlsErrors);}' Source/WebKit/NetworkProcess/soup/NetworkDataTaskSoup.cpp"
    # (TLS-9) tlsConnectionAcceptCertificateCallback: entry (SOUP2 TLS cert callback)
    - "perl -0777 -i -pe 's{(gboolean NetworkDataTaskSoup::tlsConnectionAcceptCertificateCallback\\(GTlsConnection\\* connection, GTlsCertificate\\* certificate, GTlsCertificateFlags errors, NetworkDataTaskSoup\\* task\\)\\n\\{)}{$1\\n    MOGRIX_DIAG(\"TLS_tlsConnAcceptCB_ENTRY\");}' Source/WebKit/NetworkProcess/soup/NetworkDataTaskSoup.cpp"
    # (TLS-10) networkEvent: TLS_HANDSHAKING (SOUP2 socket event)
    - "perl -i -pe 's{(m_networkLoadMetrics\\.secureConnectionStart = time;)}{MOGRIX_DIAG(\"TLS_HANDSHAKING\"); $1}' Source/WebKit/NetworkProcess/soup/NetworkDataTaskSoup.cpp"
    # (TLS-11) networkEvent: TLS_HANDSHAKED (SOUP2 socket event)
    - "perl -i -pe 's{(case G_SOCKET_CLIENT_TLS_HANDSHAKED:)}{$1\\n        MOGRIX_DIAG(\"TLS_HANDSHAKED\");}' Source/WebKit/NetworkProcess/soup/NetworkDataTaskSoup.cpp"
    # --- End HTTPS/TLS diagnostics ---
    # IRIX: g_network_monitor_get_default() returns NULL (no /proc/net, no netlink).
    # WebKit passes result directly to g_signal_connect → CRITICAL → abort() in WebProcess.
    # NULL-check both call sites.
    - "perl -i -pe 's{m_isOnLine = g_network_monitor_get_network_available\\(g_network_monitor_get_default\\(\\)\\);}{GNetworkMonitor *_nm = g_network_monitor_get_default(); m_isOnLine = _nm ? g_network_monitor_get_network_available(_nm) : true;}' Source/WebCore/platform/network/glib/NetworkStateNotifierGLib.cpp"
    - perl -i -pe 's{g_signal_connect_swapped\(g_network_monitor_get_default\(\), "network-changed"}{GNetworkMonitor *_nm2 = g_network_monitor_get_default(); if (_nm2) g_signal_connect_swapped(_nm2, "network-changed"}' Source/WebCore/platform/network/glib/NetworkStateNotifierGLib.cpp
    # IRIX: soup_session_get_feature(SOUP_TYPE_HSTS_ENFORCER) can return NULL if HSTS
    # storage init failed. WebKit passes result directly to g_signal_connect → CRITICAL.
    - "perl -i -pe 's{g_signal_connect\\(soup_session_get_feature\\(static_cast<NetworkSessionSoup&>\\(\\*m_session\\)\\.soupSession\\(\\), SOUP_TYPE_HSTS_ENFORCER\\), \"hsts-enforced\"}{auto* _hf = soup_session_get_feature(static_cast<NetworkSessionSoup\\&>(*m_session).soupSession(), SOUP_TYPE_HSTS_ENFORCER); if (_hf) g_signal_connect(_hf, \"hsts-enforced\"}' Source/WebKit/NetworkProcess/soup/NetworkDataTaskSoup.cpp"
    - "perl -i -pe 's{g_signal_handlers_disconnect_by_data\\(soup_session_get_feature\\(static_cast<NetworkSessionSoup&>\\(\\*m_session\\)\\.soupSession\\(\\), SOUP_TYPE_HSTS_ENFORCER\\), this\\)}{auto* _hf2 = soup_session_get_feature(static_cast<NetworkSessionSoup\\&>(*m_session).soupSession(), SOUP_TYPE_HSTS_ENFORCER); if (_hf2) g_signal_handlers_disconnect_by_data(_hf2, this)}' Source/WebKit/NetworkProcess/soup/NetworkDataTaskSoup.cpp"
    # write(SerializableErrorType) is inside #if ENABLE(WEB_CRYPTO) but called unconditionally.
    # Add an unconditional version outside the #if block.
    - perl -i -pe 's{^(    void write\(DestinationColorSpaceTag tag\))}{    void write(SerializableErrorType errorType)\n    {\n        writeLittleEndian<uint8_t>(m_buffer, static_cast<uint8_t>(errorType));\n    }\n\n$1}' Source/WebCore/bindings/js/SerializedScriptValue.cpp
    # WEBKIT_EXEC_PATH: Allow overriding subprocess path at runtime via env var.
    # WebKit gates this behind DEVELOPER_MODE, but bundles need it to find
    # WebKitWebProcess/WebKitNetworkProcess relative to the bundle directory.
    # Move the g_getenv("WEBKIT_EXEC_PATH") check outside the #ifdef.
    - perl -i -0pe 's{#if ENABLE\(DEVELOPER_MODE\)\n    static const char\* execDirectory = g_getenv\("WEBKIT_EXEC_PATH"\);\n    if \(execDirectory\) \{\n        String processPath = FileSystem::pathByAppendingComponent\(FileSystem::stringFromFileSystemRepresentation\(execDirectory\), StringView::fromLatin1\(processName\)\);\n        if \(FileSystem::fileExists\(processPath\)\)\n            return processPath;\n    \}\n\n    static String executablePath = getExecutablePath}{    static const char* execDirectory = g_getenv("WEBKIT_EXEC_PATH");\n    if (execDirectory) \{\n        String processPath = FileSystem::pathByAppendingComponent(FileSystem::stringFromFileSystemRepresentation(execDirectory), StringView::fromLatin1(processName));\n        if (FileSystem::fileExists(processPath))\n            return processPath;\n    \}\n\n#if ENABLE(DEVELOPER_MODE)\n    static String executablePath = getExecutablePath}' Source/WebKit/Shared/glib/ProcessExecutablePathGLib.cpp
    # IRIX: SharedMemoryHandle has a noncopyable member (UnixFileDescriptor), but
    # tries to explicitly default its copy constructor. Change to delete.
    - $MOGRIX_ROOT/tools/safepatch Source/WebKit/Platform/SharedMemory.h --old 'explicit SharedMemoryHandle(const SharedMemoryHandle&) = default;' --new 'explicit SharedMemoryHandle(const SharedMemoryHandle&) = delete;' --no-backup --quiet
    # IRIX: ShareableBitmapHandle has the same copy constructor issue.
    - $MOGRIX_ROOT/tools/safepatch Source/WebKit/Shared/ShareableBitmap.h --old 'explicit ShareableBitmapHandle(const ShareableBitmapHandle&) = default;' --new 'explicit ShareableBitmapHandle(const ShareableBitmapHandle&) = delete;' --no-backup --quiet
