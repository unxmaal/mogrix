package: mc

build_after:
  - gettext
  - glib2
  - slang

# Bundle wrapper env vars — mc hardcodes /opt/mogrix paths at compile time.
# These override so mc finds data files relative to the bundle directory.
# $dir is expanded by the wrapper script to the bundle's install path.
# mc only supports MC_DATADIR env var for sysconfig_dir, and hardcodes
# DATADIR and LIBEXECDIR at compile time. Patch source to also check
# MC_DATADIR for share_data_dir and add MC_LIBEXECDIR support.
bundle_env:
  MC_DATADIR: "$dir/etc/mc/"
  MC_SHARE_DATA: "$dir/share/mc/"
  MC_LIBEXECDIR: "$dir/libexec/mc/"

smoke_test:
  - command: "/opt/mogrix/bin/mc --version 2>&1 | head -1"
    expect: "Midnight Commander"
# Re-enablement audit (Feb 2025): SFTP virtual filesystem re-enabled.
# libssh2 now in staging. vfs-sftp was removed from configure_disable.
# mc auto-detects libssh2 and enables the SFTP VFS panel.
rules:
  drop_buildrequires:
  - e2fsprogs-devel
  - check-devel
  - aspell-en
  configure_disable:
  - aspell
  - cons-saver
  - nls
  configure_flags:
    add:
    - --with-screen=slang
  drop_subpackages:
  - python
  prep_commands:
    # Patch main.c to support MC_SHARE_DATA and MC_LIBEXECDIR env vars.
    # mc only checks MC_DATADIR for sysconfig_dir, and hardcodes DATADIR
    # and LIBEXECDIR at compile time. Bundles need runtime overrides.
    #
    # After: mc_global.share_data_dir = g_strdup (DATADIR);
    # Insert: check MC_SHARE_DATA env var override
    - |
      perl -pi -e '
        s{mc_global\.share_data_dir = g_strdup \(DATADIR\);}{
        {
            const char *share_env = g_getenv("MC_SHARE_DATA");
            mc_global.share_data_dir = g_strdup(share_env != NULL ? share_env : DATADIR);
        }}' src/main.c
    # LIBEXECDIR is a -D compile flag. Replace direct uses with inline
    # env var check so bundles can override the libexec path at runtime.
    - '$MOGRIX_ROOT/tools/safepatch src/vfs/extfs/extfs.c --old "extfs_get_plugins (LIBEXECDIR," --new "extfs_get_plugins (g_getenv(\"MC_LIBEXECDIR\") ? g_getenv(\"MC_LIBEXECDIR\") : LIBEXECDIR," --no-backup --quiet'
    - '$MOGRIX_ROOT/tools/safepatch src/vfs/shell/shell.c --old "g_build_path (PATH_SEP_STR, LIBEXECDIR," --new "g_build_path (PATH_SEP_STR, g_getenv(\"MC_LIBEXECDIR\") ? g_getenv(\"MC_LIBEXECDIR\") : LIBEXECDIR," --no-backup --quiet'
    # Help file: man2hlp (Perl) generates mc.hlp with [Contents] as the
    # top-level node, but help.c defaults to [main]. On Fedora this works
    # because the pre-built xnc.hlp (which has [main]) is installed directly.
    # During cross-build, man2hlp runs and replaces [main] with [Contents].
    # Fix: change the default node from [main] to [Contents] everywhere.
    - '$MOGRIX_ROOT/tools/safepatch src/help.c --old "event_data->node = \"[main]\";" --new "event_data->node = \"[Contents]\";" --no-backup --quiet'
    - '$MOGRIX_ROOT/tools/safepatch src/help.c --old "main_node = search_string (fdata, \"[main]\");" --new "main_node = search_string (fdata, \"[Contents]\");" --no-backup --quiet'
    - '$MOGRIX_ROOT/tools/safepatch src/filemanager/cmd.c --old "event_data.node = \"[main]\";" --new "event_data.node = \"[Contents]\";" --no-backup --quiet'
  spec_replacements:
  # autogen.sh needs autopoint (not installed). Supply the gettext files
  # autopoint would provide, then run autoreconf directly. Disable NLS
  # to avoid partial gettext build issues.
  - pattern: "./autogen.sh"
    replacement: "mkdir -p config\ncp /usr/share/gettext/config.rpath config/\ncp /usr/share/gettext/po/Makefile.in.in po/\ntouch ABOUT-NLS\nAUTOPOINT=true autoreconf -fiv -I m4\nsed -i 's/^SUBDIRS = po /SUBDIRS = /' Makefile.in"
  - pattern: contrib/mc.{sh,csh}
    replacement: contrib/mc.sh contrib/mc.csh
  - pattern: /etc/profile.d/*
    replacement: '%{_sysconfdir}/profile.d/*'
  - pattern: '%attr(755,root,root) %{_libexecdir}/mc/cons.saver'
    replacement: '# cons.saver disabled — Linux virtual console only'
  - pattern: '%{_sysconfdir}/mc/edit*

      %config(noreplace) %{_sysconfdir}/mc/*'
    replacement: '%config(noreplace) %{_sysconfdir}/mc/*'
  - pattern: '%make_install'
    replacement: '%make_install

      rm -rf %{buildroot}%{_mandir}/es %{buildroot}%{_mandir}/hu %{buildroot}%{_mandir}/it %{buildroot}%{_mandir}/pl %{buildroot}%{_mandir}/ru %{buildroot}%{_mandir}/sr'
  - pattern: '%exclude %{_libexecdir}/mc/extfs.d/{s3+,uc1541}'
    replacement: '%exclude %{_libexecdir}/mc/extfs.d/s3+

      %exclude %{_libexecdir}/mc/extfs.d/uc1541'
