package: woff2
build_after:
- brotli
rules:
  drop_subpackages:
  - tools
  export_vars:
    PKG_CONFIG_PATH: /opt/sgug-staging/usr/sgug/lib32/pkgconfig
    PKG_CONFIG_LIBDIR: /opt/sgug-staging/usr/sgug/lib32/pkgconfig
    PKG_CONFIG_SYSROOT_DIR: /opt/sgug-staging
  prep_commands:
  # cmake FindBrotli*.cmake uses find_library/find_path with HINTS from
  # pkg-config raw libdir (/usr/sgug/lib32) which doesn't exist on the build
  # host. Add the staging path as an explicit HINTS entry.
  # Note: \\$ escapes the $ so RPM shell doesn't expand cmake variables.
  - "sed -i 's|HINTS \\${PC_BROTLIDEC_LIBDIR}|HINTS /opt/sgug-staging/usr/sgug/lib32 \\${PC_BROTLIDEC_LIBDIR}|' cmake/FindBrotliDec.cmake || true"
  - "sed -i 's|HINTS \\${PC_BROTLIENC_LIBDIR}|HINTS /opt/sgug-staging/usr/sgug/lib32 \\${PC_BROTLIENC_LIBDIR}|' cmake/FindBrotliEnc.cmake || true"
  - "sed -i 's|HINTS \\${PC_BROTLIDEC_INCLUDEDIR}|HINTS /opt/sgug-staging/usr/sgug/include \\${PC_BROTLIDEC_INCLUDEDIR}|' cmake/FindBrotliDec.cmake || true"
  - "sed -i 's|HINTS \\${PC_BROTLIENC_INCLUDEDIR}|HINTS /opt/sgug-staging/usr/sgug/include \\${PC_BROTLIENC_INCLUDEDIR}|' cmake/FindBrotliEnc.cmake || true"
  spec_replacements:
  # Replace Fedora cmake macros with explicit cross-compilation
  - pattern: |
      %cmake \
          -DCMAKE_INSTALL_PREFIX="%{_prefix}" \
          -DCMAKE_INSTALL_LIBDIR="%{_libdir}" \
          -DCMAKE_SKIP_RPATH=TRUE
      %cmake_build
    replacement: |
      cmake -B _build -S . \
        -DCMAKE_MAKE_PROGRAM=/usr/bin/make \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_C_COMPILER=%{__cc} \
        -DCMAKE_CXX_COMPILER=%{__cxx} \
        -DCMAKE_AR=%{__ar} \
        -DCMAKE_RANLIB=%{__ranlib} \
        -DCMAKE_INSTALL_PREFIX=%{_prefix} \
        -DCMAKE_INSTALL_LIBDIR=%{_libdir} \
        -DCMAKE_C_FLAGS="-I/opt/sgug-staging/usr/sgug/include/mogrix-compat/generic -I/opt/sgug-staging/usr/sgug/include %{optflags}" \
        -DCMAKE_CXX_FLAGS="-I/opt/sgug-staging/usr/sgug/include/mogrix-compat/generic -I/opt/sgug-staging/usr/sgug/include %{optflags} -fno-exceptions" \
        -DCMAKE_EXE_LINKER_FLAGS="-L/opt/sgug-staging/usr/sgug/lib32 $COMPAT_DIR/libmogrix-compat.a -lgen" \
        -DCMAKE_SHARED_LINKER_FLAGS="-L/opt/sgug-staging/usr/sgug/lib32 $COMPAT_DIR/libmogrix-compat.a -lgen" \
        -DCMAKE_PREFIX_PATH=/opt/sgug-staging/usr/sgug \
        -DCMAKE_INCLUDE_PATH=/opt/sgug-staging/usr/sgug/include \
        -DCMAKE_LIBRARY_PATH=/opt/sgug-staging/usr/sgug/lib32 \
        -DCMAKE_FIND_ROOT_PATH=/opt/sgug-staging/usr/sgug \
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
        -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
        -DPKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_SKIP_RPATH=TRUE \
        -DUNIX=1
      cd _build && make %{?_smp_mflags}
  # Replace cmake install
  - pattern: "%cmake_install"
    replacement: "make -C _build install DESTDIR=%{buildroot}"
  # Fix vpath_builddir reference to _build
  - pattern: "cd %{_vpath_builddir}"
    replacement: "cd _build"
  # Add tool binaries to main files section (dropped from tools subpackage)
  - pattern: "%{_libdir}/libwoff2enc.so.*"
    replacement: |
      %{_libdir}/libwoff2enc.so.*
      %{_bindir}/woff2_compress
      %{_bindir}/woff2_decompress
      %{_bindir}/woff2_info
smoke_test:
- command: "/usr/sgug/bin/woff2_info 2>&1"
  expect: "One argument"
- command: "/usr/sgug/bin/woff2_decompress 2>&1"
  expect: "One argument"
- command: "/usr/sgug/bin/woff2_compress 2>&1"
  expect: "One argument"
