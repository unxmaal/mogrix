# createrepo_c - Repository metadata generator
# cmake-based build, needs glib2, curl, libxml2, bzip2, openssl, zlib, sqlite, rpm, zstd, drpm
package: createrepo_c

build_after: none
skip: true
skip_reason: "missing dependencies: curl-devel (no pkgconfig/headers), libzstd (not staged), drpm (not staged), libmodulemd (not staged)"
blocked: true
blocked_reason: "missing dependencies: curl-devel (no pkgconfig/headers), libzstd (not staged), drpm (not staged), libmodulemd (not staged)"

rules:
  # Replace bash-specific pushd/popd with POSIX cd
  spec_replacements:
    # %build section - fix pushd
    - pattern: "pushd build-py3"
      replacement: "cd build-py3"

    # %build section - fix popd after doc-c
    - pattern: "make doc-c\npopd"
      replacement: "make doc-c\ncd .."

    # %install section - fix pushd/popd
    - pattern: "pushd build-py3\n  # Install createrepo_c"
      replacement: "cd build-py3\n  # Install createrepo_c"

    - pattern: "make install DESTDIR=%{buildroot}\npopd"
      replacement: "make install DESTDIR=%{buildroot}\ncd .."

    # Replace %cmake macro with actual cmake command with cross-compilation toolchain
    - pattern: "%cmake .."
      replacement: "cmake .. -DCMAKE_TOOLCHAIN_FILE=/home/edodd/projects/github/unxmaal/mogrix/cross/cmake-irix-toolchain.cmake -DCMAKE_INSTALL_PREFIX=%{_prefix} -DLIB_SUFFIX=32 -DBZIP2_LIBRARIES=$MOGRIX_STAGING/lib32/libbz2.so -DBZIP2_INCLUDE_DIR=$MOGRIX_STAGING/include -DWITH_ZCHUNK=OFF -DWITH_LIBMODULEMD=OFF -DENABLE_DRPM=OFF"
