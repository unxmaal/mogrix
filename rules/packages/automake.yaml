# automake package rules for IRIX cross-compilation
# Automake is noarch (Perl/shell scripts + m4 macros)
package: automake

build_after: none

smoke_test:
  - command: "/opt/mogrix/bin/automake --version"
    expect: "1.16.5"

rules:
  # Automake's configure tries to run perl/autoconf from staging PATH, but
  # those are cross-compiled MIPS binaries. Force host versions.
  export_vars:
    PERL: "/usr/bin/perl"
    AUTOCONF: "/usr/bin/autoconf"
    AUTOM4TE: "/usr/bin/autom4te"

  install_cleanup:
    # Fix perl shebang: /usr/bin/perl is ancient IRIX system perl 5.004
    # Must use /opt/mogrix/bin/perl (SGUG-RSE perl 5.30)
    - "sed -i 's|#!/usr/bin/perl|#!/opt/mogrix/bin/perl|g' %{buildroot}%{_bindir}/automake %{buildroot}%{_bindir}/aclocal %{buildroot}%{_bindir}/automake-%{api_version} %{buildroot}%{_bindir}/aclocal-%{api_version}"
    # Fix @INC: use FindBin for relocatable module path
    # Without this, /opt/mogrix/share/automake-1.16 resolves to base IRIX system's
    # old automake modules (different prototypes) because chroot doesn't isolate
    # Must patch ALL variants: versioned (automake-1.16, aclocal-1.16) AND unversioned
    - "sed -i \"s|unshift (\\@INC, '%{_datadir}/automake-%{api_version}')|use FindBin; unshift (\\@INC, \\\"\\$FindBin::RealBin/../share/automake-%{api_version}\\\")|\" %{buildroot}%{_bindir}/automake %{buildroot}%{_bindir}/aclocal %{buildroot}%{_bindir}/automake-%{api_version} %{buildroot}%{_bindir}/aclocal-%{api_version}"

  # Old sgifixes patch was for 1.16.1 test files, may not apply to 1.16.5
  # add_patch:
  #   - automake.sgifixes.patch

