package: zsh
rules:
  drop_buildrequires:
  - glibc-langpack-ja
  - hostname
  - libcap-devel
  - texi2html
  configure_flags:
    add:
    - --enable-cap=no
    - --with-tcsetpgrp
    - --disable-pcre
    - --libdir=%{_libdir}
    remove:
    - --enable-pcre
  configure_disable:
  - dynamic
  ac_cv_overrides:
    # IRIX has sigprocmask, not BSD sigblock/sigsetmask
    ac_cv_func_sigblock: "no"
    ac_cv_func_sigsetmask: "no"
    ac_cv_func_sigprocmask: "yes"
    # IRIX has sigaction — needed with sigprocmask for POSIX_SIGNALS detection
    # Without this, zsh falls back to its own sigemptyset/sigaddset macros that
    # treat sigset_t as int, but IRIX n32 sigset_t is a struct { __sigbits[4] }
    ac_cv_func_sigaction: "yes"
    # IRIX has select — needed for 'cost' variable in zle_refresh.c.
    # HAVE_POLL references 'cost' but it's only defined under HAVE_SELECT.
    ac_cv_func_select: "yes"
    # Prevent gnulib-style gettimeofday redeclaration conflict
    ac_cv_func_gettimeofday: "yes"
  prep_commands:
  - "$MOGRIX_ROOT/tools/safepatch Src/jobs.c --delete-line 'PR_SET_NAME' --no-backup --quiet"
  - "$MOGRIX_ROOT/tools/safepatch Src/jobs.c --delete-line 'prctl' --no-backup --quiet"
  # Note: the sigemptyset/sigaddset macro issue is fixed by ac_cv_func_sigaction
  # override above, which enables POSIX_SIGNALS and skips zsh's fallback macros.
  spec_replacements:
  - pattern: zsh{path,xmod}s.h
    replacement: zshpaths.h zshxmods.h
  - pattern: test-repo-git-rebase-{apply,merge}
    replacement: test-repo-git-rebase-apply test-repo-git-rebase-merge
  - pattern: '%make_build all html'
    replacement: '%make_build all'
  - pattern: '%make_install install.info'
    replacement: '%make_install'
  - pattern: rm -f $RPM_BUILD_ROOT%{_infodir}/dir
    replacement: rm -rf $RPM_BUILD_ROOT%{_infodir}
  - pattern: '%{_infodir}/*'
    replacement: '# %{_infodir}/* — info files not built'
  - pattern: '%{_libdir}/zsh'
    replacement: '# %{_libdir}/zsh — dynamic modules disabled'
  drop_subpackages:
  - html
