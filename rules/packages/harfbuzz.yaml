package: harfbuzz
# Re-enablement audit (Feb 2025): glib, gobject, cairo, ICU re-enabled.
# harfbuzz has a circular dependency with glib2 (glib2 links harfbuzz, harfbuzz
# links glib2). Resolved by two-pass bootstrap: first build harfbuzz without glib
# (already done), then rebuild with glib+gobject+cairo+icu once glib2 is in staging.
# This produces new libraries: libharfbuzz-gobject.so, libharfbuzz-cairo.so,
# libharfbuzz-icu.so. The existing libharfbuzz.so ABI is unchanged.
# Graphite2 stays disabled (not in staging). Introspection disabled (no gobject-introspection).
rules:
  drop_buildrequires:
  - gobject-introspection-devel
  - graphite2-devel
  - gtk-doc
  spec_replacements:
  - pattern: '%configure --disable-static --with-graphite2 --with-gobject --enable-introspection'
    replacement: 'export CXX="/opt/sgug-staging/usr/sgug/bin/irix-cxx"

      export CXXFLAGS="%{optflags}"

      %configure --disable-static --without-graphite2 --with-gobject --with-glib --disable-introspection --with-cairo --with-icu

      '
  - pattern: 'License:        MIT-Modern-Variant'
    replacement: 'License:        MIT-Modern-Variant

      Provides: libharfbuzz.so.0(mips-32)

      Provides: libharfbuzz-subset.so.0(mips-32)

      Provides: libharfbuzz-icu.so.0(mips-32)

      Provides: libharfbuzz-gobject.so.0(mips-32)

      Provides: libharfbuzz-cairo.so.0(mips-32)

      Provides: harfbuzz(mips-32) = %{version}-%{release}

      '
  - pattern: 'Requires:       %{name}%{?_isa} = %{version}-%{release}

      Requires:       %{name}-icu%{?_isa} = %{version}-%{release}'
    replacement: 'Requires:       %{name} = %{version}-%{release}'
  - pattern: '%ldconfig_scriptlets


      %ldconfig_scriptlets icu'
    replacement: '# ldconfig scriptlets removed for IRIX'
  - pattern: '%files

      %license COPYING

      %doc NEWS AUTHORS README

      %{_libdir}/libharfbuzz.so.0*

      %{_libdir}/libharfbuzz-cairo.so.*

      %{_libdir}/libharfbuzz-gobject.so.0*

      %{_libdir}/libharfbuzz-subset.so.0*

      %dir %{_libdir}/girepository-1.0

      %{_libdir}/girepository-1.0/HarfBuzz-0.0.typelib'
    replacement: '%files

      %license COPYING

      %doc NEWS AUTHORS README

      %{_libdir}/libharfbuzz.so.0*

      %{_libdir}/libharfbuzz-cairo.so.*

      %{_libdir}/libharfbuzz-gobject.so.0*

      %{_libdir}/libharfbuzz-subset.so.0*

      '
  - pattern: '%files devel

      %doc %{_datadir}/gtk-doc

      %{_bindir}/hb-info

      %{_bindir}/hb-view

      %{_bindir}/hb-ot-shape-closure

      %{_bindir}/hb-shape

      %{_bindir}/hb-subset

      %{_includedir}/harfbuzz/

      %{_libdir}/libharfbuzz.so

      %{_libdir}/libharfbuzz-gobject.so

      %{_libdir}/libharfbuzz-cairo.so

      %{_libdir}/libharfbuzz-icu.so

      %{_libdir}/libharfbuzz-subset.so

      %{_libdir}/pkgconfig/harfbuzz.pc

      %{_libdir}/pkgconfig/harfbuzz-cairo.pc

      %{_libdir}/pkgconfig/harfbuzz-gobject.pc

      %{_libdir}/pkgconfig/harfbuzz-icu.pc

      %{_libdir}/pkgconfig/harfbuzz-subset.pc

      %{_libdir}/cmake/harfbuzz/

      %dir %{_datadir}/gir-1.0

      %{_datadir}/gir-1.0/HarfBuzz-0.0.gir'
    replacement: '%files devel

      %{_bindir}/hb-info

      %{_bindir}/hb-view

      %{_bindir}/hb-ot-shape-closure

      %{_bindir}/hb-shape

      %{_bindir}/hb-subset

      %doc %{_datadir}/gtk-doc

      %{_includedir}/harfbuzz/

      %{_libdir}/libharfbuzz.so

      %{_libdir}/libharfbuzz-cairo.so

      %{_libdir}/libharfbuzz-gobject.so

      %{_libdir}/libharfbuzz-icu.so

      %{_libdir}/libharfbuzz-subset.so

      %{_libdir}/pkgconfig/harfbuzz.pc

      %{_libdir}/pkgconfig/harfbuzz-cairo.pc

      %{_libdir}/pkgconfig/harfbuzz-gobject.pc

      %{_libdir}/pkgconfig/harfbuzz-icu.pc

      %{_libdir}/pkgconfig/harfbuzz-subset.pc

      %{_libdir}/cmake/harfbuzz/

      '
  prep_commands:
  - $MOGRIX_ROOT/tools/safepatch Makefile.in --old 'SUBDIRS = src util test perf docs' --new 'SUBDIRS = src util docs' --no-backup --quiet
