package: libXinerama

upstream:
  url: https://xorg.freedesktop.org/archive/individual/lib/libXinerama-1.1.4.tar.bz2
  version: "1.1.4"
  type: tarball
  build_system: autoconf
  license: MIT
  summary: "X Xinerama extension library"
  source_dir: libXinerama-1.1.4

rules:
  # X.org uses its own malloc(0) test, not the standard autoconf one
  ac_cv_overrides:
    xorg_cv_malloc0_returns_null: "no"

  # _XEatDataWords is now in staged libX11/Xlibint.h.
  # Remove stale static inline from Xinerama.c if present from previous convert.
  prep_commands:
    - "sed -i '/^#ifndef _XEatDataWords/,/^#endif/d' src/Xinerama.c || true"
