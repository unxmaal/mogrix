# Strip telemetry and phone-home from opencode.
#
# Usage:
#   mogrix transform opencode-strip --dry-run   # preview
#   mogrix transform opencode-strip              # apply
#   mogrix transform opencode-strip --check-only # verify
#
# Workflow: git pull upstream → mogrix transform opencode-strip → git commit

project: opencode
source_dir: ~/projects/github/opencode

# ── 1. models.dev auto-fetch ──────────────────────────────────────────
# Gut the refresh() function body and the setInterval loop so no
# periodic fetches to models.dev happen.  Data() still falls through
# to the local snapshot.
text_replacements:
  # 1a: Gut refresh() — replace body with empty stub
  - file: packages/opencode/src/provider/models.ts
    match: "export async function refresh() {\n    const result = await fetch(`${url()}/api.json`, {\n      headers: {\n        \"User-Agent\": Installation.USER_AGENT,\n      },\n      signal: AbortSignal.timeout(10 * 1000),\n    }).catch((e) => {\n      log.error(\"Failed to fetch models.dev\", {\n        error: e,\n      })\n    })\n    if (result && result.ok) {\n      await Filesystem.write(filepath, await result.text())\n      ModelsDev.Data.reset()\n    }\n  }"
    replace: "export async function refresh() {\n    // stripped: no remote model fetch\n  }"
    expected_count: 1

  # 1b: Kill the setInterval block that calls refresh() every hour
  - file: packages/opencode/src/provider/models.ts
    match: "if (!Flag.OPENCODE_DISABLE_MODELS_FETCH && !process.argv.includes(\"--get-yargs-completions\")) {\n  ModelsDev.refresh()\n  setInterval(\n    async () => {\n      await ModelsDev.refresh()\n    },\n    60 * 1000 * 60,\n  ).unref()\n}"
    replace: "// stripped: no periodic model fetch"
    expected_count: 1

  # 1c: Remove the fetch fallback in Data() — keep snapshot/file paths
  - file: packages/opencode/src/provider/models.ts
    match: "if (Flag.OPENCODE_DISABLE_MODELS_FETCH) return {}\n    const json = await fetch(`${url()}/api.json`).then((x) => x.text())\n    return JSON.parse(json)"
    replace: "return {}"
    expected_count: 1

  # 1d: Remove snapshot import from Data() — no bundled provider list
  - file: packages/opencode/src/provider/models.ts
    match: "// @ts-ignore\n    const snapshot = await import(\"./models-snapshot\")\n      .then((m) => m.snapshot as Record<string, unknown>)\n      .catch(() => undefined)\n    if (snapshot) return snapshot"
    replace: "// stripped: no bundled models snapshot"
    expected_count: 1

  # ── 2. Tracking headers ──────────────────────────────────────────────
  # Remove x-opencode-* headers block from LLM stream call
  - file: packages/opencode/src/session/llm.ts
    match: "headers: {\n        ...(input.model.providerID.startsWith(\"opencode\") && {\n          \"x-opencode-project\": Instance.project.id,\n          \"x-opencode-session\": input.sessionID,\n          \"x-opencode-request\": input.user.id,\n          \"x-opencode-client\": Flag.OPENCODE_CLIENT,\n        }),\n        ...input.model.headers,\n        ...headers,\n      },"
    replace: "headers: {\n        ...input.model.headers,\n        ...headers,\n      },"
    expected_count: 1

  # ── 3. OpenTelemetry (LLM) ──────────────────────────────────────────
  - file: packages/opencode/src/session/llm.ts
    match: "experimental_telemetry: {\n        isEnabled: cfg.experimental?.openTelemetry,\n        metadata: {\n          userId: cfg.username ?? \"unknown\",\n          sessionId: input.sessionID,\n        },\n      },"
    replace: ""
    expected_count: 1

  # ── 4. OpenTelemetry (Agent) ─────────────────────────────────────────
  - file: packages/opencode/src/agent/agent.ts
    match: "experimental_telemetry: {\n        isEnabled: cfg.experimental?.openTelemetry,\n        metadata: {\n          userId: cfg.username ?? \"unknown\",\n        },\n      },"
    replace: ""
    expected_count: 1

  # ── 5. Account.active() config fetch ─────────────────────────────────
  - file: packages/opencode/src/config/config.ts
    match: "const active = await Account.active()\n    if (active?.active_org_id) {\n      try {\n        const [config, token] = await Promise.all([\n          Account.config(active.id, active.active_org_id),\n          Account.token(active.id),\n        ])\n        if (token) {\n          process.env[\"OPENCODE_CONSOLE_TOKEN\"] = token\n          Env.set(\"OPENCODE_CONSOLE_TOKEN\", token)\n        }\n\n        if (config) {\n          result = mergeConfigConcatArrays(\n            result,\n            await load(JSON.stringify(config), {\n              dir: path.dirname(`${active.url}/api/config`),\n              source: `${active.url}/api/config`,\n            }),\n          )\n        }\n      } catch (err: any) {\n        log.debug(\"failed to fetch remote account config\", { error: err?.message ?? err })\n      }\n    }"
    replace: "// stripped: no remote account config fetch"
    expected_count: 1

  # ── 6. .well-known config fetch ──────────────────────────────────────
  - file: packages/opencode/src/config/config.ts
    match: "if (value.type === \"wellknown\") {\n        const url = key.replace(/\\/+$/, \"\")\n        process.env[value.key] = value.token\n        log.debug(\"fetching remote config\", { url: `${url}/.well-known/opencode` })\n        const response = await fetch(`${url}/.well-known/opencode`)\n        if (!response.ok) {\n          throw new Error(`failed to fetch remote config from ${url}: ${response.status}`)\n        }\n        const wellknown = (await response.json()) as any\n        const remoteConfig = wellknown.config ?? {}\n        // Add $schema to prevent load() from trying to write back to a non-existent file\n        if (!remoteConfig.$schema) remoteConfig.$schema = \"https://opencode.ai/config.json\"\n        result = mergeConfigConcatArrays(\n          result,\n          await load(JSON.stringify(remoteConfig), {\n            dir: path.dirname(`${url}/.well-known/opencode`),\n            source: `${url}/.well-known/opencode`,\n          }),\n        )\n        log.debug(\"loaded remote config from well-known\", { url })\n      }"
    replace: "// stripped: no well-known config fetch"
    expected_count: 1

  # ── 8. Empty the bundled models snapshot ──────────────────────────────
  # The snapshot is a 1.6 MB auto-generated file with every provider from
  # models.dev. Replace with empty export so /connect only shows configured
  # providers.
  - file: packages/opencode/src/provider/models-snapshot.ts
    match_regex: "^// Auto-generated.*\nexport const snapshot = \\{.*"
    replace: "// Auto-generated by build.ts - do not edit\nexport const snapshot = {}"
    expected_count: 1

  # ── 9. Strip hardcoded provider priority in login flow ────────────────
  - file: packages/opencode/src/cli/cmd/providers.ts
    match: "const priority: Record<string, number> = {\n          opencode: 0,\n          openai: 1,\n          \"github-copilot\": 2,\n          google: 3,\n          anthropic: 4,\n          openrouter: 5,\n          vercel: 6,\n        }"
    replace: "const priority: Record<string, number> = {}"
    expected_count: 1

  # ── 10. Strip provider recommendation hints ───────────────────────────
  - file: packages/opencode/src/cli/cmd/providers.ts
    match: "hint: {\n                opencode: \"recommended\",\n                openai: \"ChatGPT Plus/Pro or API key\",\n              }[x.id]"
    replace: "hint: undefined"
    expected_count: 1

  # ══════════════════════════════════════════════════════════════════════
  # ROUND 2: Server-side data exfiltration (from adversarial audit)
  # ══════════════════════════════════════════════════════════════════════

  # ── 11. ZenData — full conversation logging to Cloudflare R2 ─────────
  # CRITICAL: Stores every LLM prompt+response to external bucket
  - file: packages/console/app/src/routes/zen/util/dataDumper.ts
    match: "import { Resource, waitUntil } from \"@opencode-ai/console-resource\"\n\nexport function createDataDumper(sessionId: string, requestId: string, projectId: string) {"
    replace: "export function createDataDumper(sessionId: string, requestId: string, projectId: string) {"
    expected_count: 1
  - file: packages/console/app/src/routes/zen/util/dataDumper.ts
    match: "if (Resource.App.stage !== \"production\") return\n  if (sessionId === \"\") return\n\n  let data: Record<string, any> = { sessionId, requestId, projectId }\n  let metadata: Record<string, any> = { sessionId, requestId, projectId }\n\n  return {\n    provideModel: (model?: string) => {\n      data.modelName = model\n      metadata.modelName = model\n    },\n    provideRequest: (request: string) => (data.request = request),\n    provideResponse: (response: string) => (data.response = response),\n    provideStream: (chunk: string) => (data.response = (data.response ?? \"\") + chunk),\n    flush: () => {"
    replace: "return {\n    provideModel: () => {},\n    provideRequest: () => {},\n    provideResponse: () => {},\n    provideStream: () => {},\n    flush: () => {"
    expected_count: 1

  # ── 12. Honeycomb APM — geolocation + full request/response telemetry ─
  # CRITICAL: Ships conversation data + IP + lat/long to honeycomb.io
  - file: packages/console/function/src/log-processor.ts
    match: "api.honeycomb.io"
    replace: "localhost:0/disabled"
    expected_count: 1

  # ── 13. Salesforce CRM — enterprise lead capture ─────────────────────
  - file: packages/console/app/src/routes/api/enterprise.ts
    match: "import { createLead } from \"~/lib/salesforce\"\n"
    replace: ""
    expected_count: 1
  - file: packages/console/app/src/routes/api/enterprise.ts
    match: "createLead({\n        name: body.name,\n        role: body.role,\n        company: body.company,\n        email: body.email,\n        phone: body.phone,\n        message: body.message,\n      }),"
    replace: "// stripped: no salesforce lead capture"
    expected_count: 1

  # ── 14. PostHog analytics — download statistics ──────────────────────
  - file: script/stats.ts
    match: "async function sendToPostHog(event: string, properties: Record<string, any>) {\n  const key = process.env[\"POSTHOG_KEY\"]\n\n  if (!key) {\n    console.warn(\"POSTHOG_API_KEY not set, skipping PostHog event\")\n    return\n  }\n\n  const response = await fetch(\"https://us.i.posthog.com/i/v0/e/\", {\n    method: \"POST\",\n    headers: {\n      \"Content-Type\": \"application/json\",\n    },\n    body: JSON.stringify({\n      distinct_id: \"download\",\n      api_key: key,\n      event,\n      properties: {\n        ...properties,\n      },\n    }),\n  }).catch(() => null)\n\n  if (response && !response.ok) {\n    console.warn(`PostHog API error: ${response.status}`)\n  }\n}"
    replace: "async function sendToPostHog(_event: string, _properties: Record<string, any>) {\n  // stripped: no PostHog analytics\n}"
    expected_count: 1

  # ── 15. Trial limiter — IP-based tracking ────────────────────────────
  - file: packages/console/app/src/routes/zen/util/trialLimiter.ts
    match_regex: "import.*\nimport.*\nimport.*\nimport.*\n\nexport function createTrialLimiter"
    replace: "export function createTrialLimiter"
    expected_count: 1

  # ── 16. app.opencode.ai proxy fallback ───────────────────────────────
  - file: packages/opencode/src/server/server.ts
    match: "await proxy(`https://app.opencode.ai${path}`"
    replace: "await proxy(`http://localhost${path}`"
    expected_count: 1
  - file: packages/opencode/src/server/server.ts
    match: "host: \"app.opencode.ai\","
    replace: "host: \"localhost\","
    expected_count: 1

  # ── 17. GitHub version check ─────────────────────────────────────────
  - file: packages/opencode/src/installation/index.ts
    match: "const response = yield* httpOk.execute(\n            HttpClientRequest.get(\"https://api.github.com/repos/anomalyco/opencode/releases/latest\").pipe(\n              HttpClientRequest.acceptJson,\n            ),\n          )\n          const data = yield* HttpClientResponse.schemaBodyJson(GitHubRelease)(response)\n          return data.tag_name.replace(/^v/, \"\")"
    replace: "return \"0.0.0\" // stripped: no GitHub version check"
    expected_count: 1

# ── 7. Social cards + api.opencode.ai ────────────────────────────────
remove_lines:
  - pattern: "social-cards.sst.dev"
    file_glob: "**/*.ts"
  - pattern: "social-cards.sst.dev"
    file_glob: "**/*.tsx"
  - pattern: "social-cards.sst.dev"
    file_glob: "**/*.mjs"
  - pattern: "api.opencode.ai"
    file_glob: "**/*.ts"
  - pattern: "api.opencode.ai"
    file_glob: "**/*.yml"
  - pattern: "api.opencode.ai"
    file_glob: "**/*.json"
  # Honeycomb + Feishu + Discord + PostHog + contact@anoma.ly
  - pattern: "honeycomb.io"
    file_glob: "**/*.ts"
  - pattern: "open.feishu.cn"
    file_glob: "**/*.ts"
  - pattern: "contact@anoma.ly"
    file_glob: "**/*.ts"
  - pattern: "posthog.com"
    file_glob: "**/*.ts"

# ── Delete files that are pure exfiltration ──────────────────────────
delete_files:
  - packages/console/app/src/lib/salesforce.ts

# ── Postconditions ────────────────────────────────────────────────────
postconditions:
  absent_strings:
    - "models.dev/api.json"
    - "api.honeycomb.io"
    - "open.feishu.cn"
    - "us.i.posthog.com"
    # contact@anoma.ly: remaining hits are in legal pages (ToS, privacy policy,
    # billing) — legitimate "contact us" text, not data exfiltration
  present_strings:
    - "Config"
    - "Session"
    - "ModelsDev"
