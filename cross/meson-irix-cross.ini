# Meson cross file for IRIX N32 cross-compilation
# Used by mogrix to build meson-based packages
#
# NOTE: .ini files can't use env vars directly. These paths use the default
# project layout. Most packages use the dynamically generated cross-file from
# rpmmacros.irix's %meson macro instead of this static file.
# Update these paths via: mogrix setup-cross

[binaries]
c = '/home/edodd/projects/github/unxmaal/mogrix/staging/opt/mogrix/bin/irix-cc'
cpp = '/home/edodd/projects/github/unxmaal/mogrix/staging/opt/mogrix/bin/irix-cxx-libcxx'
ar = '/opt/cross/bin/llvm-ar'
strip = '/opt/cross/bin/llvm-strip'
pkgconfig = '/usr/bin/pkg-config'
ninja = '/usr/bin/ninja'

[built-in options]
c_args = ['-I/home/edodd/projects/github/unxmaal/mogrix/staging/opt/mogrix/include/mogrix-compat/generic', '-Wno-macro-redefined', '-Dalloca=__builtin_alloca', '-fno-stack-protector']
cpp_args = ['-I/home/edodd/projects/github/unxmaal/mogrix/staging/opt/mogrix/include/mogrix-compat/generic', '-Wno-macro-redefined', '-Dalloca=__builtin_alloca', '-fno-stack-protector']
c_link_args = []
cpp_link_args = []

[properties]
# sys_root is used by meson as PKG_CONFIG_SYSROOT_DIR prefix for pkg-config paths.
# Must point to staging root (where cross-built packages live), not irix-sysroot.
# IRIX native headers/libs are found via irix-cc/irix-ld wrappers, not sys_root.
sys_root = '/home/edodd/projects/github/unxmaal/mogrix/staging'
pkg_config_libdir = '/home/edodd/projects/github/unxmaal/mogrix/staging/opt/mogrix/lib32/pkgconfig:/home/edodd/projects/github/unxmaal/mogrix/staging/opt/mogrix/share/pkgconfig'
# cairo: IRIX does NOT support IPC_RMID deferred release (shmctl before shmdt)
ipc_rmid_deferred_release = false

[host_machine]
system = 'irix'
cpu_family = 'mips'
cpu = 'mips3'
endian = 'big'
