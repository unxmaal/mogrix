package: rsync
rules:
  ac_cv_overrides:
    ac_cv_type_long_double_wider: 'no'
    ac_cv_func_sigaction: 'yes'
    ac_cv_func_sigprocmask: 'yes'
  drop_buildrequires:
  - lz4-devel
  - xxhash-devel
  - libzstd-devel
  # configure_flags moved into spec_replacement (whole-block replace to avoid double-backslash)
  drop_subpackages:
  - daemon
  spec_replacements:
  # rsync uses its own configure.sh, not autoconf — %configure adds --host/--build which it rejects
  # rsync uses configure.sh (autoconf-generated) — replace whole block to avoid double-backslash issues
  - pattern: "%configure \\\n  --enable-openssl \\\n  --enable-xxhash \\\n  --enable-zstd \\\n  --enable-lz4 \\\n  --enable-ipv6"
    replacement: "CC=%{__cc} CXX=%{__cxx} AR=%{__ar} RANLIB=%{__ranlib} CFLAGS=\"%{optflags}\" LDFLAGS=\"-L/opt/sgug-staging/usr/sgug/lib32\" CPPFLAGS=\"-I/opt/sgug-staging/usr/sgug/include/mogrix-compat/generic -I/opt/sgug-staging/usr/sgug/include\" ./configure --host=mips-sgi-irix6.5 --build=x86_64-linux-gnu --prefix=%{_prefix} --libdir=%{_libdir} --mandir=%{_mandir} --disable-lz4 --disable-xxhash --disable-md2man --disable-zstd --enable-openssl --enable-ipv6"
  - pattern: '%if %isprerelease

      %setup -q -n rsync-%{version}%{?prerelease}

      '
    replacement: '%if 0

      %setup -q -n rsync-%{version}%{?prerelease}

      '
  - pattern: '%patch 2 -p1 -b .buffer-overflow'
    replacement: "%patch 2 -p1 -b .buffer-overflow\n\n# Mogrix compat sources (re-injected — emitter put them in %if branch)\nmkdir -p mogrix-compat\nfor src in %{SOURCE100} %{SOURCE101} %{SOURCE102} %{SOURCE103}\
      \ %{SOURCE104} %{SOURCE105} %{SOURCE106}; do\n  cp \"$src\" mogrix-compat/\ndone\n"
  - pattern: install -D -m644 %{SOURCE3} $RPM_BUILD_ROOT/%{_unitdir}/rsyncd.service
    replacement: '# systemd services disabled for IRIX'
  - pattern: install -D -m644 %{SOURCE2} $RPM_BUILD_ROOT/%{_unitdir}/rsyncd.socket
    replacement: '# systemd socket disabled'
  - pattern: install -D -m644 %{SOURCE4} $RPM_BUILD_ROOT/%{_sysconfdir}/rsyncd.conf
    replacement: install -D -m644 %{SOURCE4} $RPM_BUILD_ROOT/%{_sysconfdir}/rsyncd.conf
  - pattern: install -D -m644 %{SOURCE5} $RPM_BUILD_ROOT/%{_sysconfdir}/sysconfig/rsyncd
    replacement: '# sysconfig disabled'
  - pattern: install -D -m644 %{SOURCE6} $RPM_BUILD_ROOT/%{_unitdir}/rsyncd@.service
    replacement: '# systemd template disabled'
  - pattern: '%post daemon

      '
    replacement: ''
  - pattern: '%preun daemon

      '
    replacement: ''
  - pattern: '%postun daemon

      '
    replacement: ''
