package: curl
# Re-enablement audit (Feb 2025): libpsl, libidn2, brotli re-enabled.
# These are internal features — no downstream rebuilds needed.
# - libpsl: public suffix list for cookie domain validation
# - libidn2: international domain name (IDN) support
# - brotli: faster HTTP compression (Brotli content-encoding)
# Verify with: curl --version (should show brotli, IDN2, PSL in Features line)

build_after:
  - openssl

rules:
  drop_requires:
  - libnghttp2
  - libssh
  export_vars:
    PKG_CONFIG_PATH: $MOGRIX_STAGING/lib32/pkgconfig
    PKG_CONFIG_LIBDIR: $MOGRIX_STAGING/lib32/pkgconfig
    PKG_CONFIG_SYSROOT_DIR: $MOGRIX_STAGING_ROOT
    CPPFLAGS: -I$MOGRIX_STAGING/include $CPPFLAGS
    LDFLAGS: -L$MOGRIX_STAGING/lib32 $LDFLAGS
    LD: /opt/cross/bin/mips-sgi-irix6.5-ld.bfd
  ac_cv_overrides:
    curl_cv_func_recv_args: int,void *,size_t,int
    curl_cv_func_send_args: int,const void *,size_t,int
    lt_cv_path_LD: /opt/cross/bin/mips-sgi-irix6.5-ld.bfd
  configure_flags:
    add:
    - --enable-ipv6
    - --disable-ldap
    - --disable-ldaps
  configure_disable:
  - ldap
  - ldaps
  install_cleanup:
  - rm -f $RPM_BUILD_ROOT%{_libdir}/libcurl.la.minimal
  - rm -f $RPM_BUILD_ROOT%{_libdir}/libcurl.so.minimal
  spec_replacements:
  - pattern: mkdir build-{full,minimal}
    replacement: mkdir build-full build-minimal
  - pattern: build-{full,minimal}/libtool
    replacement: build-full/libtool build-minimal/libtool
  - pattern: --enable-ldap
    replacement: --disable-ldap
  - pattern: --enable-ldaps
    replacement: --disable-ldaps
  # libpsl re-enabled — dep now in staging
  - pattern: --with-libssh
    replacement: --without-libssh
  - pattern: --enable-threaded-resolver
    replacement: --disable-threaded-resolver
  - pattern: '%{_datadir}/zsh'
    replacement: '# %{_datadir}/zsh # zsh completions not built'
  - pattern: mv -v ${RPM_BUILD_ROOT}%{_bindir}/curl{,.minimal}
    replacement: mv -v ${RPM_BUILD_ROOT}%{_bindir}/curl ${RPM_BUILD_ROOT}%{_bindir}/curl.minimal
  - pattern: mv -v ${RPM_BUILD_ROOT}%{_bindir}/curl{,-%{version}}
    replacement: mv -v ${RPM_BUILD_ROOT}%{_bindir}/curl ${RPM_BUILD_ROOT}%{_bindir}/curl-%{version}
  - pattern: '# configure minimal build

      ('
    replacement: "# configure minimal build\n(\n    export CC=$MOGRIX_STAGING/bin/irix-cc\n    export CXX=$MOGRIX_STAGING/bin/irix-cxx-libcxx\n    export AR=/opt/cross/bin/llvm-ar\n    export\
      \ RANLIB=/opt/cross/bin/llvm-ranlib\n    export LD=/opt/cross/bin/mips-sgi-irix6.5-ld.bfd\n    export CPPFLAGS=\"-I$MOGRIX_STAGING/include\"\n    export LDFLAGS=\"-L$MOGRIX_STAGING/lib32\""
  - pattern: '# configure full build

      ('
    replacement: "# configure full build\n(\n    export CC=$MOGRIX_STAGING/bin/irix-cc\n    export CXX=$MOGRIX_STAGING/bin/irix-cxx-libcxx\n    export AR=/opt/cross/bin/llvm-ar\n    export\
      \ RANLIB=/opt/cross/bin/llvm-ranlib\n    export LD=/opt/cross/bin/mips-sgi-irix6.5-ld.bfd\n    export CPPFLAGS=\"-I$MOGRIX_STAGING/include\"\n    export LDFLAGS=\"-L$MOGRIX_STAGING/lib32\""
  - pattern: '    %configure $common_configure_opts   \'
    replacement: '    ../configure --prefix=/opt/mogrix --exec-prefix=/opt/mogrix --bindir=/opt/mogrix/bin --sbindir=/opt/mogrix/sbin --libdir=/opt/mogrix/lib32 --includedir=/opt/mogrix/include --datadir=/opt/mogrix/share
      --mandir=/opt/mogrix/share/man --infodir=/opt/mogrix/share/info --sysconfdir=/opt/mogrix/etc --host=mips-sgi-irix6.5 --build=x86_64-linux-gnu $common_configure_opts \'
  - pattern: --with-ssl --with-ca-bundle
    replacement: --with-openssl=$MOGRIX_STAGING --with-ca-bundle
  - pattern: --with-gssapi
    replacement: --without-gssapi
  # libidn2 re-enabled — dep now in staging
  - pattern: --with-nghttp2
    replacement: --without-nghttp2
  # brotli re-enabled — dep now in staging
