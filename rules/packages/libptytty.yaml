# libptytty - pty/tty library for rxvt-unicode (upstream: 2.0)
# CMake build. Has IRIX _getpty() support. No FC40 SRPM available.
package: libptytty

build_after: none

upstream:
  url: http://dist.schmorp.de/libptytty/libptytty-2.0.tar.gz
  version: "2.0"
  type: tarball
  build_system: cmake
  license: GPLv2+
  summary: "Pty/tty library with utmp/wtmp/lastlog handling"

rules:
  export_vars:
    LLVM_PROJECT: /home/edodd/projects/github/unxmaal/mogrix/tmp/llvm-build/llvm-project-22.1.2.src

  drop_buildrequires:
    - signify
  spec_replacements:
    # Skip signify signature verification (signify not available on build host)
    - pattern: "signify -V -p '%{SOURCE2}' -m '%{SOURCE0}'"
      replacement: "echo 'Skipping signify verification for cross-build'"
    # Replace %cmake + %cmake_build with raw cmake cross-compilation
    - pattern: "%cmake -G Ninja\n%cmake_build"
      replacement: |
        export COMPAT_DIR=$(pwd)/mogrix-compat
        cmake -B _build -S . \
          -DCMAKE_MAKE_PROGRAM=/usr/bin/make \
          -DPKG_CONFIG_EXECUTABLE=/usr/bin/pkg-config \
          -DCMAKE_SYSTEM_NAME=IRIX \
          -DCMAKE_C_COMPILER=%{__cc} \
          -DCMAKE_CXX_COMPILER=$MOGRIX_STAGING/bin/irix-cxx-libcxx \
          -DCMAKE_AR=%{__ar} \
          -DCMAKE_RANLIB=%{__ranlib} \
          -DCMAKE_INSTALL_PREFIX=%{_prefix} \
          -DCMAKE_INSTALL_LIBDIR=%{_libdir} \
          -DCMAKE_C_FLAGS="-I$MOGRIX_STAGING/include/mogrix-compat/generic -I$MOGRIX_STAGING/include" \
          -DCMAKE_CXX_FLAGS="-I$MOGRIX_STAGING/include/mogrix-compat/generic -I$MOGRIX_STAGING/include" \
          -DCMAKE_EXE_LINKER_FLAGS="-L$MOGRIX_STAGING/lib32 $COMPAT_DIR/libmogrix-compat.a -lgen" \
          -DCMAKE_SHARED_LINKER_FLAGS="-L$MOGRIX_STAGING/lib32 $COMPAT_DIR/libmogrix-compat.a -lgen" \
          -DCMAKE_PREFIX_PATH=$MOGRIX_STAGING \
          -DCMAKE_INCLUDE_PATH=$MOGRIX_STAGING/include \
          -DCMAKE_LIBRARY_PATH=$MOGRIX_STAGING/lib32 \
          -DCMAKE_FIND_ROOT_PATH=$MOGRIX_STAGING \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DTTY_GID_SUPPORT_EXITCODE=1
        cd _build && make %{?_smp_mflags}
    # Replace cmake install macro
    - pattern: "%cmake_install"
      replacement: "cd _build && make install DESTDIR=%{buildroot}"
    # Fix %files globs for unversioned .so (libptytty doesn't use soversion)
    - pattern: "%{_libdir}/*.so.*"
      replacement: "%{_libdir}/libptytty.so"
    - pattern: "%{_libdir}/*.so\n%{_libdir}/pkgconfig/*.pc"
      replacement: "%{_libdir}/pkgconfig/libptytty.pc"
