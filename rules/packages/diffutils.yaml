package: diffutils

build_after: none
classes:
- nls-disabled
smoke_test:
- command: /opt/mogrix/bin/diff --version
  expect: '3.10'
rules:
  drop_buildrequires:
  - perl-Getopt-Long
  configure_flags:
    remove:
    - --without-included-regex
  inject_compat_functions:
  - timegm
  export_vars:
    # _GNU_SOURCE must be defined before gnulib headers are processed.
    # irix-cc force-includes time.h, which processes gnulib's time.h wrapper
    # before config.h defines _GNU_SOURCE. Without this, timezone_t typedef
    # and mktime_z/localtime_rz are not declared.
    CPPFLAGS: "-D_GNU_SOURCE=1 $CPPFLAGS"
  ac_cv_overrides:
    ac_cv_func_sigprocmask: "yes"
    ac_cv_func_sigaction: "yes"
    ac_cv_func_timegm: "yes"
  prep_commands:
  - "$MOGRIX_ROOT/tools/safepatch Makefile.in --old 'gnulib-tests' --new '' --no-backup --quiet"
  - "$MOGRIX_ROOT/tools/safepatch Makefile.am --old 'gnulib-tests' --new '' --no-backup --quiet || true"
  - "$MOGRIX_ROOT/tools/safepatch src/system.h --old '#define pI \"t\"' --new '#define pI \"\"' --no-backup --quiet"
  - "$MOGRIX_ROOT/tools/safepatch src/diff.c --old 'STAT_TIMESPEC_NS' --new 'DISABLED_STAT_TIMESPEC_NS' --count 0 --no-backup --quiet"
  # gnulib signal.in.h NSIG/sigaction fixes now in generic.yaml
