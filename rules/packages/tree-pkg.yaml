# tree - directory listing in tree format
package: tree-pkg

build_after: none
rules:
  prep_commands:
  # Makefile hardcodes CC=gcc — must override for cross-compilation
  - "$MOGRIX_ROOT/tools/safepatch Makefile --old 'CC=gcc' --new 'CC=%{__cc}' --no-backup --quiet"
  # IRIX pwd.h defines 'struct comment' — rename tree's to avoid collision
  - "$MOGRIX_ROOT/tools/safepatch tree.h --old 'struct comment {' --new 'struct tree_comment {' --no-backup --quiet"
  - "$MOGRIX_ROOT/tools/safepatch tree.h --old 'struct comment *next;' --new 'struct tree_comment *next;' --no-backup --quiet"
  - "$MOGRIX_ROOT/tools/safepatch tree.h --old 'struct comment *comments;' --new 'struct tree_comment *comments;' --no-backup --quiet"
  - "$MOGRIX_ROOT/tools/safepatch tree.h --old 'struct comment *infocheck' --new 'struct tree_comment *infocheck' --no-backup --quiet"
  - "for f in info.c file.c tree.c; do $MOGRIX_ROOT/tools/safepatch $f --old 'struct comment' --new 'struct tree_comment' --count 0 --no-backup --quiet || :; done"
