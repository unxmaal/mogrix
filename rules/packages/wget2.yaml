package: wget2
rules:
  drop_buildrequires:
  - git-core
  - pandoc
  - lcov
  - lzip
  - rsync
  - pkgconfig(gpgme)
  - pkgconfig(libbrotlidec)
  - pkgconfig(libmicrohttpd)
  - pkgconfig(libnghttp2)
  - pkgconfig(libpsl)
  ac_cv_overrides:
    # Prevent gnulib gettimeofday replacement (IRIX variadic signature conflicts)
    ac_cv_func_gettimeofday: "yes"
    gl_cv_func_gettimeofday_posix_signature: "almost"
    # Prevent gnulib sigaction replacement (conflicts with IRIX signal.h)
    ac_cv_func_sigaction: "yes"
    gl_cv_func_sigaction: "yes"
    # Prevent gnulib nanosleep replacement (timespec_t vs struct timespec)
    ac_cv_func_nanosleep: "yes"
    ac_cv_search_nanosleep: "none required"
    gl_cv_func_nanosleep: "yes"
    # Prevent gnulib raise replacement (NSIG constraint)
    gl_cv_func_raise: "yes"
    ac_cv_func_raise: "yes"
    # Prevent gnulib sigprocmask replacement (IRIX sigset_t is struct, not int)
    ac_cv_func_sigprocmask: "yes"
    gl_cv_func_sigprocmask: "yes"
  prep_commands:
    # gnulib signal.in.h has NSIG <= 32 constraint; IRIX has NSIG=65. Raise the limit.
    - "perl -pi -e 's/NSIG <= 32/NSIG <= 128/' gl/lib/signal.in.h lib/signal.in.h 2>/dev/null || true"
  spec_replacements:
  - pattern: '%bcond as_wget 1

      %endif'
    replacement: '%bcond as_wget 0

      %endif'
  - pattern: '%find_lang %{name}

      '
    replacement: ''
  - pattern: '%files -f %{name}.lang

      '
    replacement: '%files

      '
  - pattern: '%if 0%{?rhel}

      # tarball includes a pre-built manpage

      install -D -m0644 -t %{buildroot}%{_mandir}/man1/ docs/man/man1/wget2.1

      %endif'
    replacement: '# Install pre-built manpage from tarball (no pandoc for cross-build)

      install -D -m0644 -t %{buildroot}%{_mandir}/man1/ docs/man/man1/wget2.1'
  - pattern: '%{_mandir}/man3/libwget*.3*

      '
    replacement: ''
