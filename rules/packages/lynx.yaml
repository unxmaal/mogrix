package: lynx
blocked: true
blocked_reason: "configure can't find SSL even with --with-ssl=$MOGRIX_STAGING — needs investigation"

build_after:
  - ncurses
  - openssl
  - zlib-ng

upstream:
  url: https://invisible-mirror.net/archives/lynx/tarballs/lynx2.9.2.tar.bz2
  version: 2.9.2
  type: tarball
  build_system: autoconf
  license: GPLv2
  summary: Text-mode web browser
  source_dir: lynx2.9.2
rules:
  explicit_provides:
  - lynx
  export_vars:
    CFLAGS: -Wno-deprecated-declarations
  prep_commands:
  - sed -i 's/^char \*strstr(char \*buf, char \*sub)/char *strstr(const char *buf, const char *sub)/' src/strstr.c
  configure_flags:
    add:
    - --with-screen=ncurses
    - --with-ssl=$MOGRIX_STAGING
    - --with-zlib
    - --disable-nls
    - --disable-ipv6
    - --disable-rpath-hack
    - --enable-default-colors
    - --enable-persistent-cookies
    - --enable-prettysrc
    - --enable-scrollbar
    - --enable-read-eta
    - --enable-charset-choice
    - --enable-externs
    - --enable-cgi-links
    - --enable-internal-links
    - --enable-nsl-fork
    - --enable-file-upload
    - --enable-source-cache
