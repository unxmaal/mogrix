package: libXi

build_after:
  - libX11
  - libXext
  - xorg-x11-proto-devel

upstream:
  url: https://xorg.freedesktop.org/archive/individual/lib/libXi-1.7.10.tar.bz2
  version: "1.7.10"
  type: tarball
  build_system: autoconf
  license: MIT
  summary: "X Input extension library"
  source_dir: libXi-1.7.10

rules:
  # X.org uses its own malloc(0) test, not the standard autoconf one
  ac_cv_overrides:
    xorg_cv_malloc0_returns_null: "no"

  # _XEatDataWords, Xge.h, and XGE functions are now in the staged
  # libX11 and headers. No workaround patches needed.
  # Remove stale _XEatDataWords static inline from XIint.h if present
  # (from a previous convert that applied xeatdatawords.patch).
  prep_commands:
    - "sed -i '/^#ifndef _XEatDataWords/,/^#endif/d' src/XIint.h || true"

  install_cleanup:
    - "rm -rf %{buildroot}%{_docdir}"
