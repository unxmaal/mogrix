# most - pager program (uses slang)
package: most

build_after:
  - slang

rules:
  spec_replacements:
    # Tell configure where to find slang in cross-compilation sysroot
    - pattern: "%configure"
      replacement: "%configure --with-slanglib=$MOGRIX_STAGING/lib32 --with-slanginc=$MOGRIX_STAGING/include"
    # make install puts docs in %{_docdir}/%{name} which conflicts with %doc's %{_pkgdocdir}
    - pattern: "%make_install"
      replacement: "%make_install\nrm -rf %{buildroot}%{_docdir}/%{name}"
    # Doc files removed above — simplify %doc to avoid file-not-found
    - pattern: "%doc README changes.txt most.txt most-fun.txt lesskeys.rc most.rc"
      replacement: "%doc README changes.txt"
  prep_commands:
    # chkslang is a cross-compiled binary that can't run on build host.
    # Replace the slangversion target with a no-op (we know slang 2.3.3 >= 2.0)
    - "$MOGRIX_ROOT/tools/safepatch src/Makefile.in --old '$(OBJDIR)/chkslang $(EXEC)' --new 'true # chkslang skipped for cross-build' --no-backup --quiet"
