# libsecret package rules for IRIX cross-compilation
package: libsecret

# Regenerated patch for 0.21.3 (was 0.19.1).
# Fixes MAP_ANON usage in egg/egg-secure-memory.c — IRIX lacks MAP_ANON,
# so we use /dev/zero mmap instead.
# Old Makefile.am -DWITH_VALGRIND removal no longer needed (meson build now).
add_patch:
  - libsecret.sgifixes.patch

rules:
  drop_buildrequires:
    - gobject-introspection-devel
    - gi-docgen
    - python3-devel
    - vala
  spec_replacements:
    # Add IRIX-specific meson options after the crypto option block
    - pattern: "-Dcrypto=gnutls \\\n%else\n-Dcrypto=libgcrypt \\\n%endif\n%{nil}"
      replacement: "-Dcrypto=gnutls \\\n%else\n-Dcrypto=libgcrypt \\\n%endif\n-Dintrospection=false -Dvapi=false -Dgtk_doc=false -Dmanpage=false \\\n%{nil}"
    # gdbus-codegen from sysroot needs Python 'packaging' module — uv run sets PYTHONPATH
    # to its venv which lacks 'packaging'. Use /usr/bin/python3 to get real system site-packages.
    - pattern: "%meson_build"
      replacement: "export PYTHONPATH=$(/usr/bin/python3 -c 'import site; print(\":\".join(site.getsitepackages()))')${PYTHONPATH:+:$PYTHONPATH}\n%meson_build"
    # Remove girepository files from %files (introspection disabled)
    - pattern: "%dir %{_libdir}/girepository-1.0\n%{_libdir}/girepository-1.0/Secret-1.typelib\n"
      replacement: ""
    # Remove manpage from %files (manpage generation disabled)
    - pattern: "%{_mandir}/man1/secret-tool.1*\n"
      replacement: ""
    # Remove gir files from %files devel (introspection disabled)
    - pattern: "%dir %{_datadir}/gir-1.0\n%{_datadir}/gir-1.0/Secret-1.gir\n"
      replacement: ""
    # Remove vala files from %files devel (vapi disabled)
    - pattern: "%dir %{_datadir}/vala\n%dir %{_datadir}/vala/vapi\n%{_datadir}/vala/vapi/libsecret-1.deps\n%{_datadir}/vala/vapi/libsecret-1.vapi\n"
      replacement: ""
    # Remove docs from %files devel (gtk_doc disabled)
    - pattern: "%doc %{_docdir}/libsecret-1/\n"
      replacement: ""
  prep_commands:
    # Make gobject-introspection optional in meson.build
    - "sed -i \"s/dependency('gobject-introspection-1.0'/dependency('gobject-introspection-1.0', required: false/g\" meson.build || true"
