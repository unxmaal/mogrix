package: libXfixes

build_after:
  - libX11
  - libXext
  - xorg-x11-proto-devel

upstream:
  url: https://xorg.freedesktop.org/archive/individual/lib/libXfixes-5.0.3.tar.bz2
  version: "5.0.3"
  type: tarball
  build_system: autoconf
  license: MIT
  summary: "X Fixes library"
  source_dir: libXfixes-5.0.3

add_source:
  - xeatdatawords.patch

rules:
  # _XEatDataWords is now in staged libX11/Xlibint.h.
  # The old patch added a conflicting static inline; remove it if present.
  # The original source doesn't define it, but the patch may have been applied
  # from a previous convert. Use sed to strip any local static inline definition.
  prep_commands:
    - "sed -i '/^#ifndef _XEatDataWords/,/^#endif/d' src/Xfixesint.h || true"
