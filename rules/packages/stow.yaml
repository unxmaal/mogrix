# stow - GNU Stow, symlink farm manager (FC40: 2.3.1)
# Perl-based noarch package with autotools build system.
# Needs perl_vendorlib macro defined for module installation path.
package: stow

build_after: none

rules:
  spec_replacements:
    # Define perl_vendorlib macro - not set in rpmmacros.irix
    - pattern: "AutoReq: no"
      replacement: "AutoReq: no\n%define perl_vendorlib /opt/mogrix/share/perl5"
  install_cleanup:
    # Fix @INC: hardcoded /opt/mogrix/share/perl5 won't resolve in bundle context
    # Use FindBin-relative path so the bundled Stow modules are found
    - "sed -i 's|use lib \"/opt/mogrix/share/perl5\";|use FindBin; use lib \"$FindBin::RealBin/../share/perl5\";|' %{buildroot}%{_bindir}/stow %{buildroot}%{_bindir}/chkstow"

smoke_test:
  - command: "/opt/mogrix/bin/stow --version"
    expect: "2.3.1"
