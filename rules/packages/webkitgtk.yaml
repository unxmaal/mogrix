package: webkitgtk
upstream:
  url: https://webkitgtk.org/releases/webkitgtk-2.42.5.tar.xz
  version: "2.42.5"
  type: tarball
  build_system: cmake
  license: LGPLv2+
  summary: "GTK port of the WebKit rendering engine"
  source_dir: webkitgtk-2.42.5
add_source:
  - irix_pthread_compat.h
  - ipc_debug_log.h
  - webkit_subprocess_diag.h
  - IPCSemaphoreUnix_irix.cpp
  - compile-llint-twostep.sh
add_patch:
  - jit-mips-vmov-fp64.patch
  - jit-bigendian-jsvalue32.patch
rules:
  # %autosetup needs -p1 for Patch500 (vmov FP64 fix) — original spec has no patches
  spec_replacements:
    - pattern: "%autosetup -n webkitgtk-%{version}"
      replacement: "%autosetup -p1 -n webkitgtk-%{version}"
    # Enable JIT, disable CLoop interpreter
    - pattern: "-DENABLE_JIT=OFF"
      replacement: "-DENABLE_JIT=ON"
    - pattern: "-DENABLE_C_LOOP=ON"
      replacement: "-DENABLE_C_LOOP=OFF"
    - pattern: "-DENABLE_DFG_JIT=OFF"
      replacement: "-DENABLE_DFG_JIT=ON"
  inject_compat_functions:
    - strdup
    - getline
    - mkdtemp
    - strerror_r
    - memmem
    - mincore
    - __muloti4
  prep_commands:
    # Use host preprocessor for IDL code generation (cross-compiler includes
    # IRIX-compat stdarg.h with 'typedef char *va_list' that breaks IDL parser)
    - $MOGRIX_ROOT/tools/safepatch Source/cmake/WebKitCompilerFlags.cmake --old '\"${CMAKE_CXX_COMPILER}\" -E -P -x c++' --new '\"/usr/bin/g++\" -E -P -x c++' --no-backup --quiet
    # IRIX PTHREAD_KEYS_MAX is _sysconf() (runtime), WebKit needs constexpr
    - $MOGRIX_ROOT/tools/safepatch Source/WTF/wtf/ThreadingPrimitives.h --old 'static constexpr ThreadSpecificKey InvalidThreadSpecificKey = PTHREAD_KEYS_MAX' --new 'static constexpr ThreadSpecificKey InvalidThreadSpecificKey = 128' --no-backup --quiet
    # IRIX lacks MAP_FILE — it's 0 on all modern systems (just means "map from file")
    - $MOGRIX_ROOT/tools/safepatch Source/WTF/wtf/FileSystem.cpp --old 'MAP_FILE | ' --new '' --no-backup --quiet
    # IRIX lacks pthread_getattr_np (GNU) and pthread_attr_getstack (POSIX.1-2001).
    # Include compat header that provides inline wrappers using IRIX's separate functions.
    - cp %{_sourcedir}/irix_pthread_compat.h Source/WTF/wtf/irix_pthread_compat.h
    - perl -i -pe 's{^(#include <pthread\.h>)}{$1\n#include "irix_pthread_compat.h"}' Source/WTF/wtf/StackBounds.cpp
    # Include sys/resource.h and unistd.h for IRIX too (needed by getrlimit in compat header)
    # Only add __sgi to the FIRST #if OS(LINUX) (include block).
    # The SECOND one uses SYS_gettid which is Linux-specific — leave it alone.
    # Use perl to match the two-line sequence (rpmbuild /bin/sh doesn't support $'...\n...').
    - "perl -0777 -pi -e 's/#if OS\\(LINUX\\)\\n#include <sys\\/resource\\.h>/#if OS(LINUX) || defined(__sgi)\\n#include <sys\\/resource.h>/' Source/WTF/wtf/StackBounds.cpp"
    # IRIX C++ name collision: struct flock vs flock() function.
    # Add extern "C" flock prototype before the USE(FILE_LOCK) section.
    - perl -i -pe 's{^(#if USE\(FILE_LOCK\))}{#ifdef __sgi\nextern "C" int flock(int, int);\n#endif\n$1}' Source/WTF/wtf/posix/FileSystemPOSIX.cpp
    # IRIX lacks MAP_ANON — anonymous mmap uses /dev/zero instead.
    # Define MAP_ANON as 0 and open /dev/zero as fd.
    - perl -i -pe 's{^(#include <sys/mman\.h>)}{$1\n#ifdef __sgi\n#include <fcntl.h>\n#ifndef MAP_ANON\n#define MAP_ANON 0\n#endif\n#endif}' Source/WTF/wtf/posix/OSAllocatorPOSIX.cpp
    - perl -i -pe 's{int fd = -1;}{int fd = -1;\n#ifdef __sgi\n    fd = open("/dev/zero", O_RDWR);\n#endif}' Source/WTF/wtf/posix/OSAllocatorPOSIX.cpp
    # IRIX lacks CLOCK_THREAD_CPUTIME_ID — fall back to getrusage for per-thread CPU time
    - perl -i -pe 's{int ret = clock_gettime\(CLOCK_THREAD_CPUTIME_ID, &ts\);}{struct rusage ru;\n    int ret = getrusage(RUSAGE_SELF, \&ru);\n    ts.tv_sec = ru.ru_utime.tv_sec + ru.ru_stime.tv_sec;\n    ts.tv_nsec = (ru.ru_utime.tv_usec + ru.ru_stime.tv_usec) * 1000;}' Source/WTF/wtf/posix/CPUTimePOSIX.cpp
    # CMAKE_SYSTEM_NAME is "Linux" (cmake has no IRIX support), so WebKit
    # includes Linux-specific sources. Remove them and use generic fallbacks.
    - $MOGRIX_ROOT/tools/safepatch Source/WTF/wtf/PlatformGTK.cmake --delete-line 'linux/RealTimeThreads.h' --no-backup --quiet
    # Disable Linux-specific sources — we set CMAKE_SYSTEM_NAME=Linux because cmake
    # has no IRIX support, but we need generic fallbacks, not Linux procfs/cgroups code.
    - $MOGRIX_ROOT/tools/safepatch Source/WTF/wtf/PlatformGTK.cmake --old 'CMAKE_SYSTEM_NAME MATCHES "Linux"' --new 'FALSE' --count 0 --no-backup --quiet
    - $MOGRIX_ROOT/tools/safepatch Source/cmake/OptionsGTK.cmake --old 'CMAKE_SYSTEM_NAME MATCHES "Linux"' --new 'FALSE' --count 0 --no-backup --quiet
    # CLoop interpreter: t6 and t7 registers not declared but referenced by UNUSED_VARIABLE
    - $MOGRIX_ROOT/tools/safepatch Source/JavaScriptCore/llint/LowLevelInterpreter.cpp --old 'CLoopRegister t0, t1, t2, t3, t5, sp, cfr, lr, pc;' --new 'CLoopRegister t0, t1, t2, t3, t5, t6, t7, sp, cfr, lr, pc;' --no-backup --quiet
    # --- JIT ENABLEMENT ---
    # Enable JIT on IRIX (gated on OS(LINUX), add __sgi)
    - $MOGRIX_ROOT/tools/safepatch Source/WTF/wtf/PlatformEnable.h --old '|| CPU(MIPS)) && OS(LINUX)' --new '|| CPU(MIPS)) && (OS(LINUX) || defined(__sgi))' --no-backup --quiet
    # Include sys/cachectl.h on IRIX for JIT cache flushing
    - $MOGRIX_ROOT/tools/safepatch Source/JavaScriptCore/jit/ExecutableAllocator.h --old 'CPU(MIPS) && OS(LINUX)' --new 'CPU(MIPS) && (OS(LINUX) || defined(__sgi))' --no-backup --quiet
    # LOCAL_LABEL_STRING macro undefined for IRIX — add __sgi to GNU as-compatible block
    - $MOGRIX_ROOT/tools/safepatch Source/WTF/wtf/InlineASM.h --old '|| COMPILER(MINGW)' --new '|| COMPILER(MINGW) || defined(__sgi)' --no-backup --quiet
    # HIDE_SYMBOL: add IRIX to ELF hidden visibility block (uses .hidden directive)
    - $MOGRIX_ROOT/tools/safepatch Source/WTF/wtf/InlineASM.h --old '|| OS(HPUX)' --new '|| OS(HPUX) || defined(__sgi)' --no-backup --quiet
    # LLInt offline assembler emits MIPS32 'mul rd,rs,rt' — not on MIPS III/IV.
    # Replace with 'mult rs,rt' + 'mflo rd' (matches existing smulli pattern).
    - "perl -i -pe 's{emitMIPS\\(\"mul\", operands\\)}{if operands.size == 3\\n            \\$asm.puts \"mult #{operands[1].mipsOperand}, #{operands[0].mipsOperand}\"\\n            \\$asm.puts \"mflo #{operands[2].mipsOperand}\"\\n        else\\n            raise unless operands.size == 2\\n            \\$asm.puts \"mult #{operands[0].mipsOperand}, #{operands[1].mipsOperand}\"\\n            \\$asm.puts \"mflo #{operands[1].mipsOperand}\"\\n        end}' Source/JavaScriptCore/offlineasm/mips.rb"
    # LLInt offline assembler uses O32 register names $t4-$t7 — not valid in N32.
    # In N32, registers 12-15 are $t0-$t3, not $t4-$t7. Use numeric names.
    - perl -i -pe 's/"\\\$t4"/"\\$12"/g; s/"\\\$t5"/"\\$13"/g; s/"\\\$t7"/"\\$15"/g' Source/JavaScriptCore/offlineasm/mips.rb
    - perl -i -pe 's/SpecialRegister\.new\("\\\$t7"\)/SpecialRegister.new("\\$15")/g' Source/JavaScriptCore/offlineasm/mips.rb
    # LowLevelInterpreter.cpp: clang 16/18 MIPS backend uses 56GB+ RAM due to a
    # bug in cc1 inline asm handling for large TUs. x86 compiles same file in 95MB.
    # Workaround: two-step compile (clang -emit-llvm 126MB + llc 42MB = 168MB total).
    # Set RULE_LAUNCH_COMPILE on LowLevelInterpreterLib (it only has this one file).
    # Also set -march=mips4 so movz/movn work (MIPS IV, supported by R10000+).
    - chmod +x %{_sourcedir}/compile-llint-twostep.sh
    - perl -i -pe 'BEGIN{$done=0} if(!$done && /^WEBKIT_FRAMEWORK\(JavaScriptCore\)/){print "set_property(TARGET LowLevelInterpreterLib PROPERTY RULE_LAUNCH_COMPILE \"%{_sourcedir}/compile-llint-twostep.sh\")\nset_source_files_properties(llint/LowLevelInterpreter.cpp PROPERTIES COMPILE_FLAGS \"-O0 -DRELEASE_WITHOUT_OPTIMIZATIONS -march=mips4\")\n"; $done=1}' Source/JavaScriptCore/CMakeLists.txt
    # Disable .cpload (O32 PIC) for IRIX N32 — $gp is callee-saved, no per-label setup needed
    - $MOGRIX_ROOT/tools/safepatch Source/JavaScriptCore/llint/LLIntOfflineAsmConfig.h --old '#ifdef WTF_MIPS_PIC' --new '#if defined(WTF_MIPS_PIC) && !defined(__sgi)' --no-backup --quiet
    # Fix push/pop 4-byte → 8-byte stack alignment for N32 ABI
    - "perl -i -pe 's/\"addiu \\$sp, \\$sp, -4\"/\"addiu \\$sp, \\$sp, -8\"/g; s/\"addiu \\$sp, \\$sp, 4\"/\"addiu \\$sp, \\$sp, 8\"/g' Source/JavaScriptCore/offlineasm/mips.rb"
    # --- End JIT ENABLEMENT ---
    # IRIX mincore takes caddr_t (char*) not void* — add cast
    - $MOGRIX_ROOT/tools/safepatch Source/JavaScriptCore/heap/BlockDirectory.cpp --old 'auto result = mincore(pageStart,' --new 'auto result = mincore(reinterpret_cast<caddr_t>(pageStart),' --no-backup --quiet
    # MIPS clang backend can't guarantee tail call elimination — disable MUST_TAIL_CALL
    - $MOGRIX_ROOT/tools/safepatch Source/WTF/wtf/Compiler.h --old '__has_cpp_attribute(clang::musttail)' --new '0' --no-backup --quiet
    # MIPS branch range: ColorConversion.cpp and ColorLuminance.cpp expand to huge template
    # functions via callOnUnderlyingType. LLVM's MIPS assembler can't relax 16-bit branch
    # offsets, causing "out of range PC16 fixup". Exclude from unified builds (@no-unify)
    # and compile at -O1 to reduce code size.
    - $MOGRIX_ROOT/tools/safepatch Source/WebCore/Sources.txt --old 'platform/graphics/ColorConversion.cpp' --new 'platform/graphics/ColorConversion.cpp@no-unify' --no-backup --quiet
    - $MOGRIX_ROOT/tools/safepatch Source/WebCore/Sources.txt --old 'platform/graphics/ColorLuminance.cpp' --new 'platform/graphics/ColorLuminance.cpp@no-unify' --no-backup --quiet
    - perl -i -pe 'BEGIN{$done=0} if(!$done && /^WEBKIT_FRAMEWORK\(WebCore\)/){print "set_source_files_properties(platform/graphics/ColorConversion.cpp platform/graphics/ColorLuminance.cpp PROPERTIES COMPILE_FLAGS \"-O1\")\n"; $done=1}' Source/WebCore/CMakeLists.txt
    # IRIX lacks MSG_NOSIGNAL — define as 0 (like macOS does). Use SIG_IGN SIGPIPE instead.
    - $MOGRIX_ROOT/tools/safepatch Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp --old '#if OS(DARWIN)' --new '#if OS(DARWIN) || defined(__sgi)' --no-backup --quiet
    # IRIX AF_UNIX doesn't support SOCK_SEQPACKET — fall back to SOCK_STREAM (like macOS).
    # WebKit uses length-prefixed IPC framing so stream semantics work fine.
    - $MOGRIX_ROOT/tools/safepatch Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp --old '!OS(DARWIN)' --new '!OS(DARWIN) && !defined(__sgi)' --no-backup --quiet
    # IRIX CLOEXEC fix: GLib's g_fdwalk_set_cloexec uses /proc/self/fd to enumerate
    # fds. IRIX has no /proc/self/fd; the brute-force fallback clobbers the IPC
    # socket fd with FD_CLOEXEC. Skip SetCloexecOnClient on IRIX (safe: no
    # xdg-dbus-proxy). HIGH-LEVEL: affects all GLib GSubprocess fd passing.
    - "perl -i -pe 's{(    return IPC::PlatformConnectionOptions::SetCloexecOnClient \\| IPC::PlatformConnectionOptions::SetCloexecOnServer;)}{#ifdef __sgi\\n    // IRIX: no /proc/self/fd, GLib fdwalk clobbers IPC socket fd with CLOEXEC\\n    return IPC::PlatformConnectionOptions::SetCloexecOnServer;\\n#else\\n$1\\n#endif}' Source/WebKit/UIProcess/Launcher/glib/ProcessLauncherGLib.cpp"
    # --- IPC debug logging (TEMPORARY - remove after verifying CLOEXEC fix) ---
    # All format strings live in ipc_debug_log.h macros to avoid YAML % escaping issues.
    - cp %{_sourcedir}/ipc_debug_log.h Source/WebKit/Platform/IPC/unix/ipc_debug_log.h
    - perl -i -pe 's{^(#include <poll\.h>)}{$1\n#include "ipc_debug_log.h"}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log connection opened
    - perl -i -pe 's{(m_isConnected = true;)}{$1\n    IPC_LOG_OPEN(m_socketDescriptor, getpid());}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log recvmsg error (after EINTR retry)
    - perl -i -0pe 's{(if \(errno == EINTR\)\n\s+continue;\n\n\s+)(buffer\.shrink)}{$1IPC_LOG_RECV_ERR(errno, socketDescriptor);\n            $2}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log MSG_CTRUNC
    - perl -i -0pe 's{(if \(message\.msg_flags & MSG_CTRUNC\) \{\n)(\s+// Control data)}{$1            IPC_LOG_CTRUNC(socketDescriptor);\n$2}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log ECONNRESET in readyReadHandler
    - perl -i -0pe 's{(if \(errno == ECONNRESET\) \{\n\s+)(connectionDidClose\(\);\n\s+return;)}{$1IPC_LOG_CLOSE_CONNRESET(m_socketDescriptor, getpid());\n                $2}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log other recv error in readyReadHandler
    - perl -i -0pe 's{(safeStrerror\(errno\)\.data\(\)\);\n\s+)(connectionDidClose\(\);)}{$1IPC_LOG_CLOSE_RECV_ERR(errno, m_socketDescriptor, getpid());\n                $2}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log EOF in readyReadHandler
    - perl -i -0pe 's{(if \(!bytesRead\) \{\n\s+)(connectionDidClose\(\);)}{$1IPC_LOG_CLOSE_EOF(m_socketDescriptor, getpid());\n            $2}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log GLib HUP/ERR/NVAL
    - perl -i -0pe 's{(if \(condition & G_IO_HUP \|\| condition & G_IO_ERR \|\| condition & G_IO_NVAL\) \{\n\s+)(protectedThis->connectionDidClose)}{$1IPC_LOG_CLOSE_GIO(condition, getpid());\n            $2}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log ECONNRESET in sendOutputMessage
    - perl -i -0pe 's{(if \(errno == ECONNRESET\)\n#endif\n\s+\{\n\s+)(connectionDidClose)}{$1IPC_LOG_CLOSE_SEND(errno, m_socketDescriptor, getpid());\n            $2}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log other send error (match "Error sending" specifically to avoid matching recv error)
    - perl -i -pe 's{(WTFLogAlways\("Error sending[^;]+;)}{$1 IPC_LOG_SEND_ERR(errno, m_socketDescriptor, getpid());}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log platformInvalidate
    - perl -i -pe 's{(m_socketDescriptor = -1;)}{IPC_LOG_INVALIDATE(m_socketDescriptor, getpid()); $1}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # Log processMessage count (every 50th)
    - perl -i -pe 's{(processIncomingMessage\(WTFMove\(decoder\)\);)}{$1 { static int _mc=0; if(++_mc==1||_mc%50==0) IPC_LOG_MSG(_mc, getpid()); }}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # --- End IPC debug logging ---
    # --- IRIX IPC Semaphore: pipe-based replacement for Linux eventfd ---
    # WebKit's IPC::Semaphore uses eventfd (#if OS(LINUX)) for shared-memory
    # stream connection signaling. On IRIX, eventfd doesn't exist, so signal()
    # is a no-op and wait() returns false — breaking NetworkProcess IPC entirely.
    # Replace with pipe-based semaphore (read end for wait/poll, write end for signal).
    - cp %{_sourcedir}/IPCSemaphoreUnix_irix.cpp Source/WebKit/Platform/IPC/unix/IPCSemaphoreUnix.cpp
    # Header: add two-fd constructor for IRIX pipe decode
    - perl -i -pe 's{(explicit Semaphore\(UnixFileDescriptor&&\);)}{$1\n#ifdef __sgi\n    Semaphore(UnixFileDescriptor\&\& readFd, UnixFileDescriptor\&\& writeFd);\n#endif}' Source/WebKit/Platform/IPC/IPCSemaphore.h
    # Header: add m_writeFd member for IRIX pipe write end
    - perl -i -pe 's{(    UnixFileDescriptor m_fd;)}{$1\n#ifdef __sgi\n    UnixFileDescriptor m_writeFd;\n#endif}' Source/WebKit/Platform/IPC/IPCSemaphore.h
    # --- End IRIX IPC Semaphore ---
    # --- Subprocess init diagnostics (TEMPORARY - find where WebProcess/_exit()s) ---
    # Copy diag header to each directory that needs it (avoids include path issues)
    - cp %{_sourcedir}/webkit_subprocess_diag.h Source/WebKit/Shared/webkit_subprocess_diag.h
    - cp %{_sourcedir}/webkit_subprocess_diag.h Source/WebKit/Shared/unix/webkit_subprocess_diag.h
    - cp %{_sourcedir}/webkit_subprocess_diag.h Source/WebKit/WebProcess/gtk/webkit_subprocess_diag.h
    - cp %{_sourcedir}/webkit_subprocess_diag.h Source/WebKit/Platform/IPC/unix/webkit_subprocess_diag.h
    # AuxiliaryProcessMain.h: instrument run() template (both WebProcess + NetworkProcess)
    - perl -i -pe 's{^(#include <wtf/RunLoop\.h>)}{$1\n#include "webkit_subprocess_diag.h"}' Source/WebKit/Shared/AuxiliaryProcessMain.h
    - perl -i -pe 's{(m_parameters\.processType = AuxiliaryProcessType::processType;)}{$1\n        MOGRIX_DIAG("run_entry");}' Source/WebKit/Shared/AuxiliaryProcessMain.h
    - perl -i -pe 's{(if \(!parseCommandLine\(argc, argv\)\))}{MOGRIX_DIAG("platform_init_ok");\n\n        $1}' Source/WebKit/Shared/AuxiliaryProcessMain.h
    - perl -i -pe 's{(InitializeWebKit2\(\);)}{MOGRIX_DIAG("parse_cmdline_ok");\n\n        $1}' Source/WebKit/Shared/AuxiliaryProcessMain.h
    - perl -i -pe 's{(initializeAuxiliaryProcess\(WTFMove)}{MOGRIX_DIAG("webkit2_init_ok");\n\n        $1}' Source/WebKit/Shared/AuxiliaryProcessMain.h
    - perl -i -pe 's{(RunLoop::run\(\);)}{MOGRIX_DIAG("aux_process_init_ok");\n        $1}' Source/WebKit/Shared/AuxiliaryProcessMain.h
    - perl -i -pe 's{(platformFinalize\(\);)}{MOGRIX_DIAG("runloop_exited");\n        $1}' Source/WebKit/Shared/AuxiliaryProcessMain.h
    # WebProcessMainGtk.cpp: instrument platformInitialize + WebProcessMain entry
    - perl -i -pe 's{^(#include "AuxiliaryProcessMain\.h")}{$1\n#include "webkit_subprocess_diag.h"}' Source/WebKit/WebProcess/gtk/WebProcessMainGtk.cpp
    - perl -i -pe 's{(return AuxiliaryProcessMain<WebProcessMainGtk>)}{MOGRIX_DIAG("WebProcessMain_entry"); $1}' Source/WebKit/WebProcess/gtk/WebProcessMainGtk.cpp
    - perl -i -pe 's{(gtk_init\(nullptr, nullptr\);)}{MOGRIX_DIAG("before_gtk_init"); $1}' Source/WebKit/WebProcess/gtk/WebProcessMainGtk.cpp
    - perl -i -pe 's{(bindtextdomain\(GETTEXT_PACKAGE)}{MOGRIX_DIAG("after_gtk_init"); $1}' Source/WebKit/WebProcess/gtk/WebProcessMainGtk.cpp
    # AuxiliaryProcessMain.cpp: instrument parseCommandLine + SIGPIPE setup
    - perl -i -pe 's{^(#include "AuxiliaryProcessMain\.h")}{$1\n#include "webkit_subprocess_diag.h"}' Source/WebKit/Shared/unix/AuxiliaryProcessMain.cpp
    - perl -i -pe 's{(ASSERT\(argc >= 3\);)}{MOGRIX_DIAG_INT("parseCommandLine_argc", argc); $1}' Source/WebKit/Shared/unix/AuxiliaryProcessMain.cpp
    - perl -i -pe 's{(RELEASE_ASSERT\(!sigaction\(SIGPIPE)}{MOGRIX_DIAG("aux_platformInit_sigpipe"); $1}' Source/WebKit/Shared/unix/AuxiliaryProcessMain.cpp
    # ConnectionUnix.cpp: instrument Connection::platformInitialize + g_socket_new_from_fd
    - perl -i -pe 's{^(#include "ipc_debug_log\.h")}{$1\n#include "webkit_subprocess_diag.h"}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    - perl -i -pe 's{(m_socketDescriptor = identifier\.handle;)}{MOGRIX_DIAG_INT("conn_platformInit_fd", identifier.handle);\n    $1}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    - perl -i -pe 's{(m_socket = adoptGRef\(g_socket_new_from_fd\(m_socketDescriptor, nullptr\)\);)}{$1\n    if (!m_socket) MOGRIX_DIAG("CRITICAL_g_socket_new_from_fd_NULL"); else { MOGRIX_DIAG("g_socket_new_from_fd_OK"); MOGRIX_DIAG_INT("g_socket_get_fd", g_socket_get_fd(m_socket.get())); MOGRIX_DIAG_INT("g_socket_is_closed", (int)g_socket_is_closed(m_socket.get())); GIOCondition _cond = g_socket_condition_check(m_socket.get(), G_IO_IN); MOGRIX_DIAG_INT("g_socket_condition_check_at_init", (int)_cond); }}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # --- End subprocess init diagnostics ---
    # --- Shared-path receive diagnostics (TEMPORARY) ---
    # These fire for ALL connections (inherited + brokered) so working connections provide baseline.
    # See docs/webkit-ipc-flow-map.md for step mapping.
    # All patterns use single-line anchors or -0777 for multiline. Tested anchors are unique in file.
    #
    # (1) platformOpen: log GSocket state at monitor start time [step 5/18/24]
    - 'perl -i -pe ''s{(m_readSocketMonitor\.start\(m_socket\.get\(\))}{MOGRIX_DIAG_INT("platformOpen_fd", m_socketDescriptor); MOGRIX_DIAG_INT("platformOpen_gsock_closed", m_socket ? (int)g_socket_is_closed(m_socket.get()) : -1); $1}'' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp'
    # (2) platformOpen: tag the explicit initial readyReadHandler dispatch [step 6]
    # Anchor: unique comment line preceding the dispatch
    - 'perl -i -0pe ''s{(// Schedule a call to readyReadHandler\.\n)}{$1    MOGRIX_DIAG_INT("readyRead_explicit_dispatch_fd", m_socketDescriptor);\n}'' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp'
    # (3) GSocketMonitor callback: log EVERY invocation [step 7/37]
    # Anchor: unique first-line-of-lambda condition check
    - perl -i -pe 's{(if \(condition & G_IO_HUP \|\| condition & G_IO_ERR \|\| condition & G_IO_NVAL\))}{MOGRIX_DIAG_INT("monitorCB_fd", protectedThis->m_socketDescriptor); MOGRIX_DIAG_INT("monitorCB_cond", (int)condition); $1}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # (4) GSocketMonitor: log REMOVE on error [step 38 error path]
    # Anchor: IPC_LOG_CLOSE_GIO is unique in file
    - perl -i -pe 's{(IPC_LOG_CLOSE_GIO\(condition, getpid\(\)\);)}{$1 MOGRIX_DIAG_INT("monitorCB_REMOVE_err_fd", protectedThis->m_socketDescriptor);}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # (5) GSocketMonitor: log before/after readyReadHandler call [step 38 normal path]
    # Anchor: "return G_SOURCE_CONTINUE;" is unique in file (only in read callback)
    - perl -i -pe 's{(return G_SOURCE_CONTINUE;)}{MOGRIX_DIAG_INT("monitorCB_CONTINUE_fd", protectedThis->m_socketDescriptor); $1}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
    # (6) readyReadHandler: log entry [step 8/40]
    # Anchor: unique "while (true) {" immediately after readyReadHandler opening
    # Use -0777 for the function-open multiline match
    - perl -0777 -i -pe 's{(void Connection::readyReadHandler\(\)\n\{)}{$1\n    MOGRIX_DIAG_INT("readyRead_entry_fd", m_socketDescriptor);}' Source/WebKit/Platform/IPC/unix/ConnectionUnix.cpp
