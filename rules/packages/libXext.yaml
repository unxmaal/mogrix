# libXext 1.3.6 - X11 miscellaneous extensions library (FC40: 1.3.6-1)
# Autotools build. Depends on libX11, xorgproto.

package: libXext

rules:

  spec_replacements:
    # Skip autoreconf
    - pattern: "autoreconf -v --install --force\n"
      replacement: "# autoreconf skipped — using pre-generated configure\n"

    # Add explicit Provides
    - pattern: "URL: http://www.x.org"
      replacement: |
        URL: http://www.x.org
        Provides: libXext(mips-32) = %{version}-%{release}
        Provides: libXext.so.6(mips-32)
        Provides: pkgconfig(xext)

    # Remove ldconfig macros (not applicable for cross-compile)
    - pattern: "%ldconfig_post\n"
      replacement: ""
    - pattern: "%ldconfig_postun\n"
      replacement: ""

  configure_flags:
    add:
      - --disable-static
      - --disable-specs
      - --without-xmlto
      - --without-fop

  ac_cv_overrides:
    xorg_cv_malloc0_returns_null: 'no'
    ac_cv_func_reallocarray: 'no'

  drop_buildrequires:
    - xorg-x11-util-macros
