package: fribidi
rules:
  configure_flags:
    add:
    - --disable-docs
  prep_commands:
  # Rename user-defined utime() to avoid conflict with POSIX utime() on IRIX
  # Pattern: definition at line start 'utime (' and calls '= utime ()'
  # Avoid matching struct member 'tms_utime'
  - "sed -i 's/^utime (/fribidi_bench_utime (/' bin/fribidi-benchmark.c"
  - "sed -i 's/= utime/= fribidi_bench_utime/g' bin/fribidi-benchmark.c"
  install_cleanup:
  - rm -rf %{buildroot}%{_mandir}/man3
  spec_replacements:
  - pattern: '%if 0%{?rhel} && 0%{?rhel} <= 8'
    replacement: '%if 1'
