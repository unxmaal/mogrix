# ripgrep — Line-oriented search tool (Rust)
#
# Pure Rust binary, no C library deps beyond system libs.
# Uses cargo +nightly -Zbuild-std for cross-compilation.
# Hand-written spec at ~/rpmbuild/SPECS/ripgrep.spec
#
# IRIX fix: dirent d_name must be [c_char; 256] not [c_char; 1]
# for readdir_r compatibility. See patches/crates/libc/unix/irix/mod.rs.
# Without this, any directory traversal causes SIGSEGV (readdir_r overflows
# the 1-byte d_name buffer on the stack).


package: ripgrep
build_after: none
language: rust

smoke_test:
  - command: "rg --version 2>&1"
    expect: "ripgrep"
  - command: "rg --help 2>&1"
    expect: "PATTERN"

build_after: none
