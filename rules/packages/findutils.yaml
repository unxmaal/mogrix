# findutils has deep gnulib conflicts (getopt.h, perror, nanosleep).
# Needs systemic compat header fix. Skip from rebuild-all for now.
package: findutils
skip: true
classes:
- nls-disabled
smoke_test:
- command: /usr/sgug/bin/find --version
  expect: 4.9.0
- command: /usr/sgug/bin/xargs --version
  expect: 4.9.0
rules:
  drop_buildrequires:
  - dejagnu
  inject_compat_functions:
  - timegm
  export_vars:
    # _GNU_SOURCE must be defined before gnulib headers are processed.
    # See diffutils.yaml for full explanation of the timezone_t issue.
    CPPFLAGS: "-D_GNU_SOURCE=1 $CPPFLAGS"
  ac_cv_overrides:
    ac_cv_func_timegm: "yes"
    gl_cv_func_strerror_r_works: "yes"
    ac_cv_func_strerror_r: "yes"
  prep_commands:
    # gnulib's perror.c calls strerror_r expecting GNU return type (char*),
    # but our compat provides POSIX (int). Provide stub that calls real perror.
    - "printf '#include <stdio.h>\\nvoid rpl_perror(const char *s) { perror(s); }\\n' > gl/lib/perror.c || true"
    - "printf '#include <stdio.h>\\nvoid rpl_perror(const char *s) { perror(s); }\\n' > lib/perror.c || true"
  spec_replacements:
  - pattern: autoreconf -fiv
    replacement: 'AUTOPOINT=true autoreconf -fiv

      sed -i ''s/gnulib-tests//'' Makefile.in || true

      sed -i ''s/gnulib-tests//'' Makefile.am || true

      # Fix gnulib stdint.in.h: AC_COMPUTE_INT produces empty values in cross-compile

      # which breaks SIG_ATOMIC_MAX (and potentially other type limits)

      sed -i ''s/@BITSIZEOF_SIG_ATOMIC_T@/32/g; s/@HAVE_SIGNED_SIG_ATOMIC_T@/1/g; s/@SIG_ATOMIC_T_SUFFIX@//g'' lib/stdint.in.h gl/lib/stdint.in.h 2>/dev/null || true'
  - pattern: '%{_infodir}/find.info*'
    replacement: '# %{_infodir}/find.info* (removed — no texinfo)'
  - pattern: '%{_infodir}/find-maint.info.*'
    replacement: '# %{_infodir}/find-maint.info.* (removed — no texinfo)'
  install_cleanup:
  - rm -rf %{buildroot}%{_infodir}
