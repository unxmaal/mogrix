# dash package rules for IRIX cross-compilation
package: dash

build_after: none

add_patch:
  # builtins.def is generated by preprocessing builtins.def.in with $(COMPILE) -E.
  # Cross-compilation CPPFLAGS pulls in IRIX system headers, leaking typedefs,
  # struct braces, externs, etc. mkbuiltins parses these as builtin names.
  # Patch rewrites the Makefile rule to pipe through a perl filter.
  - fix-builtins-makefile.patch

rules:
  # IRIX has sigsetmask in libc but no header declaration for it.
  # Force configure to say "no" so dash uses the POSIX sigprocmask fallback
  # in system.h's sigclearmask() inline function.
  ac_cv_overrides:
    ac_cv_func_sigsetmask: "no"
    # IRIX libc has killpg (declared in <sys/signal.h>), but cross-compile
    # configure can't detect it. Without this, dash defines a static inline
    # killpg that conflicts with the IRIX header declaration.
    ac_cv_func_killpg: "yes"

  # stpncpy: dash uses stpncpy in jobs.c; IRIX libc doesn't have it.
  inject_compat_functions:
    - stpncpy

  prep_commands:
    # Fix undeclared vfork: IRIX doesn't declare vfork in <unistd.h>.
    # Define vfork as fork — functionally equivalent, universally available.
    - "$MOGRIX_ROOT/tools/safepatch src/jobs.c --insert-top '#define vfork fork' --no-backup --quiet"
    # IRIX uses _sys_siglist (with leading underscore) instead of sys_siglist.
    # dash's fallback strsignal() (compiled when HAVE_STRSIGNAL is undef)
    # references sys_siglist which doesn't exist on IRIX.
    - "$MOGRIX_ROOT/tools/safepatch src/system.c --insert-top '#define sys_siglist _sys_siglist' --no-backup --quiet"

# dash doesn't support --version (it's a minimal POSIX shell).
# Test with -c 'echo' instead.
smoke_test:
  - command: /opt/mogrix/bin/dash -c 'echo dash-ok'
    expect: "dash-ok"
