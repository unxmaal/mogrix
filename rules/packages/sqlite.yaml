# sqlite - SQL database engine
#
# ---metadata---
# complexity: medium
# build_system: autoconf
# key_fixes: [disable_math_funcs, LLONG_MAX_define, _ABI_SOURCE, LONGDOUBLE_TYPE]
# similar_to: []
# depends: [zlib]
# status: WORKING (library works, CLI has file write crash - not blocking)
# ---

package: sqlite

rules:
  # lemon is a build-time parser generator — runs on the build host (x86-64),
  # not on IRIX. Dropping it prevents an x86-64 binary in a .mips.rpm which
  # would fail dep-check (libc.so.6 unresolvable).
  drop_subpackages:
    - lemon
    - tcl
    - analyzer
  # Note: bcond_invert is not implemented, using spec_replacements instead

  configure_flags:
    add:
      - --disable-static
      - --enable-shared
      - --disable-math  # IRIX lacks C99 math functions (acosh/asinh/atanh)
    remove:
      # These are Linux-specific features not available on IRIX
      - --enable-threadsafe
      - --enable-threads-override-locks

  # Force libtool to build shared libraries (it mis-detects cross-compilation)
  ac_cv_overrides:
    lt_cv_deplibs_check_method: "pass_all"
    ac_cv_func_malloc_usable_size: "no"

  # IRIX compatibility environment variables
  export_vars:
    # SQLITE_ENABLE_MATH_FUNCTIONS=0 disables SQL math functions
    # SQLITE_HAVE_C99_MATH_FUNCS=0 disables C99 math functions (acosh/asinh/atanh not on IRIX)
    # Define LLONG_MAX/MIN since IRIX predates C99
    # _ABI_SOURCE makes _ABIAPI true, using extern select() instead of static wrapper
    # LONGDOUBLE_TYPE=double avoids 128-bit long double (clang MIPS doesn't support -mlong-double-64)
    # SQLITE_OMIT_WAL: IRIX fcntl(F_SETLK) correctly rejects F_WRLCK on O_RDONLY fds per POSIX.
    # Linux silently allows this (POSIX violation). SQLite WAL mode depends on this Linux behavior
    # for lock escalation at offset 0x40000002 (SHARED_FIRST). Without WAL, SQLite uses DELETE
    # journal mode which doesn't need write locks on read-only fds. RPM 4.19 hardcodes WAL but
    # handles the failure gracefully: `if (sqlexec(sdb, "PRAGMA journal_mode = WAL") == 0)` — skips WAL config.
    CPPFLAGS: "-D_ABI_SOURCE -DSQLITE_ENABLE_MATH_FUNCTIONS=0 -DSQLITE_HAVE_C99_MATH_FUNCS=0 -DLLONG_MAX=9223372036854775807LL -DLLONG_MIN=-9223372036854775808LL -DLONGDOUBLE_TYPE=double -DSQLITE_MAX_MMAP_SIZE=268435456 -DSQLITE_OMIT_WAL $CPPFLAGS"

  # Note: skip_check is handled globally in generic.yaml

  # Remove .la and .a files left after install (we only want shared libs)
  install_cleanup:
    - rm -f $RPM_BUILD_ROOT%{_libdir}/*.la
    - rm -f $RPM_BUILD_ROOT%{_libdir}/*.a

  spec_replacements:
    # Disable tcl support - not available for IRIX cross-compilation
    - pattern: "%bcond_without tcl"
      replacement: "%bcond_with tcl"
    - pattern: "%bcond_without sqldiff"
      replacement: "%bcond_with sqldiff"
    # Fix multi-line CFLAGS export — the backslash continuations break mogrix
    # compat injection which inserts code after "export CFLAGS=..." line.
    # Collapse to a single line so the emitter can inject after it cleanly.
    - pattern: "export CFLAGS=\"$RPM_OPT_FLAGS $RPM_LD_FLAGS \\\n               -DSQLITE_ENABLE_COLUMN_METADATA=1 \\\n               -DSQLITE_DISABLE_DIRSYNC=1 \\\n               -DSQLITE_SECURE_DELETE=1 \\\n               -DSQLITE_ENABLE_UNLOCK_NOTIFY=1 -DSQLITE_ENABLE_DBSTAT_VTAB=1 \\\n               -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 \\\n               -DSQLITE_ENABLE_DBPAGE_VTAB \\\n               -Wall -fno-strict-aliasing\""
      replacement: "export CFLAGS=\"$RPM_OPT_FLAGS $RPM_LD_FLAGS -DSQLITE_ENABLE_COLUMN_METADATA=1 -DSQLITE_DISABLE_DIRSYNC=1 -DSQLITE_SECURE_DELETE=1 -DSQLITE_ENABLE_UNLOCK_NOTIFY=1 -DSQLITE_ENABLE_DBSTAT_VTAB=1 -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 -DSQLITE_ENABLE_DBPAGE_VTAB -Wall -fno-strict-aliasing\""
    # Fix libtool to build shared libraries for IRIX using generic script
    # Remove lemon install commands (subpackage dropped)
    - pattern: "install -D -m0755 lemon $RPM_BUILD_ROOT/%{_bindir}/lemon\ninstall -D -m0644 tool/lempar.c $RPM_BUILD_ROOT/%{_datadir}/lemon/lempar.c"
      replacement: "# lemon install removed for IRIX (subpackage dropped)"
    # Remove the %if %{with tcl} block entirely (tcl, sqldiff, analyzer subpackages)
    - pattern: "%if %{with tcl}\n%files tcl\n%{tcl_sitearch}/sqlite3\n\n%if %{with sqldiff}\n%files tools\n%{_bindir}/sqldiff\n%endif\n\n%files analyzer\n%{_bindir}/sqlite3_analyzer\n%endif"
      replacement: "# tcl/tools/analyzer subpackages removed for IRIX"
    - pattern: "sed -i 's|^runpath_var=LD_RUN_PATH|runpath_var=DIE_RPATH_DIE|g' libtool"
      replacement: |
        sed -i 's|^runpath_var=LD_RUN_PATH|runpath_var=DIE_RPATH_DIE|g' libtool
        # Fix libtool for IRIX cross-compilation
        $MOGRIX_ROOT/tools/fix-libtool-irix.sh libtool || exit 1
