# tk package rules for IRIX cross-compilation
package: tk

build_after:
  - fontconfig
  - freetype
  - libX11
  - libXft
  - zlib-ng

# IRIX-specific patches from SGUG-RSE
add_patch:
  - tk.sgifixes.patch

rules:
  configure_flags:
    add:
      - --with-tcl=$MOGRIX_STAGING/lib32
      - --enable-threads

  spec_replacements:
    # Fix brace expansion — /bin/sh doesn't support {a,b} syntax
    - pattern: "mkdir -p %{buildroot}/%{_includedir}/%{name}-private/{generic/ttk,unix}"
      replacement: "mkdir -p %{buildroot}/%{_includedir}/%{name}-private/generic/ttk %{buildroot}/%{_includedir}/%{name}-private/unix"
