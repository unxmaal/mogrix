# pcre v1 — Perl-compatible regular expression library
# FC40 has pcre-8.45 as a deprecated compat package
package: pcre

build_after:
  - pcre

rules:
  configure_flags:
    add:
    - --enable-utf
    - --enable-unicode-properties
    - --enable-pcre8
    - --enable-pcre16
    - --enable-pcre32
    - --disable-silent-rules
    - --disable-cpp
    remove:
    - --enable-jit
    - --enable-pcretest-libreadline

  drop_buildrequires:
    - readline-devel

  drop_subpackages:
    - doc
    - static
    - tools

  # Cross-compile detects bcopy but not memmove — force memmove detection
  ac_cv_overrides:
    ac_cv_func_memmove: "yes"

  spec_replacements:
    # Skip GPG verification
    - pattern: "%{gpgverify} --keyring='%{SOURCE2}' --signature='%{SOURCE1}' --data='%{SOURCE0}'"
      replacement: ": # skip gpgv2 signature verification"

    # Remove ppc64 strict-aliasing conditional block in %build
    - pattern: "# There is a strict-aliasing problem on PPC64, bug #881232\n%ifarch ppc64\n%global optflags %{optflags} -fno-strict-aliasing\n%endif"
      replacement: "# strict-aliasing conditional removed for cross-build"

    # Remove JIT conditional from %configure — we always disable JIT (no MIPS JIT support)
    - pattern: "%ifarch s390 s390x sparc64 sparcv9 riscv64\n    --disable-jit \\\n%else\n    --enable-jit \\\n%endif"
      replacement: "    --disable-jit \\"

    # Remove %check section arch-specific conditionals
    - pattern: "%ifarch s390 s390x ppc\n# larger stack is needed on s390, ppc\nulimit -s 10240\n%endif"
      replacement: "# stack size conditional removed for cross-build"

    # Remove deprecated() provides (not needed on IRIX)
    - pattern: "Provides:  deprecated()"
      replacement: "# deprecated() not needed on IRIX"

  # Remove pcrecpp files (C++ disabled)
  remove_lines:
    - "%{_libdir}/libpcrecpp.so.0"
    - "%{_libdir}/libpcrecpp.so.0.*"
    - "%{_libdir}/libpcrecpp.so"
    - "%{_includedir}/pcrecpp.h"
    - "%{_includedir}/pcre_scanner.h"
    - "%{_includedir}/pcre_stringpiece.h"
    - "%{_libdir}/pkgconfig/libpcrecpp.pc"

  install_cleanup:
    - rm -f %{buildroot}%{_bindir}/pcregrep
    - rm -f %{buildroot}%{_bindir}/pcretest
    - rm -f %{buildroot}%{_libdir}/*.a
    - rm -f %{buildroot}%{_mandir}/man1/pcregrep.*
    - rm -f %{buildroot}%{_mandir}/man1/pcretest.*
    - rm -f %{buildroot}%{_libdir}/libpcrecpp* %{buildroot}%{_libdir}/pkgconfig/libpcrecpp.pc %{buildroot}%{_includedir}/pcrecpp.h %{buildroot}%{_includedir}/pcre_scanner.h %{buildroot}%{_includedir}/pcre_stringpiece.h || true
